name: Apply fix 165

on:
  push:
    branches:
      - fix/165-storyboard-duplicate-frame

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Fix temporary workflow parser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/165-storyboard-duplicate-frame
          fetch-depth: 0
      - name: Apply root-cause fix and regression tests
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/apply-fix-165.py
          python3 /tmp/apply-fix-165.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix repeated storyboard sync frames (#165)'
          git push origin HEAD:fix/165-storyboard-duplicate-frame
