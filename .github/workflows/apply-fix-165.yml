name: Apply fix 165

on:
  push:
    branches:
      - fix/165-storyboard-duplicate-frame

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary workflow to apply storyboard duplicate-frame fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/165-storyboard-duplicate-frame
          fetch-depth: 0

      - name: Apply root-cause fix and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('app/src/mobile/java/app/local1st/files/ui/browser/VideoStoryboardDialog.kt')
          text = target.read_text()

          text = text.replace('private const val CACHE_VERSION = 6', 'private const val CACHE_VERSION = 7', 1)

          old = '''            var preferClosestFrames = false

            while (remaining.isNotEmpty()) {'''
          new = '''            var preferClosestFrames = false
            var previousSyncFingerprint: Long? = null
            var previousSyncTimeMs: Long? = null

            while (remaining.isNotEmpty()) {'''
          if old not in text:
              raise SystemExit('generation state marker not found')
          text = text.replace(old, new, 1)

          old = '''                val extracted = extractFrame(
                    retriever = retriever,
                    timeMs = timeMs,
                    preferClosest = preferClosestFrames,
                )
                if (extracted.syncWhiteoutRecovered) {
                    // Once this file proves that its sync frames can decode as blank white while
                    // the exact frame is valid, skip unreliable sync probes for the remaining
                    // storyboard. This both fixes the white tiles and avoids paying for two decodes
                    // per frame on affected videos.
                    preferClosestFrames = true
                }'''
          new = '''                val extracted = extractFrame(
                    retriever = retriever,
                    timeMs = timeMs,
                    preferClosest = preferClosestFrames,
                    previousSyncFingerprint = previousSyncFingerprint,
                    previousSyncTimeMs = previousSyncTimeMs,
                )
                extracted.syncFingerprint?.let { fingerprint ->
                    previousSyncFingerprint = fingerprint
                    previousSyncTimeMs = timeMs
                }
                if (extracted.syncWhiteoutRecovered || extracted.duplicateSyncRecovered) {
                    // Once sync seeking proves unreliable for this file, use exact-position frames
                    // for the rest of the storyboard instead of repeatedly trusting the same bad
                    // sync sample. This also avoids paying for duplicate verification on each frame.
                    preferClosestFrames = true
                }'''
          if old not in text:
              raise SystemExit('extractFrame call marker not found')
          text = text.replace(old, new, 1)

          start = text.index('    private data class FrameExtraction(')
          end = text.index('    private fun extractClosestFrame(', start)
          replacement = '''    private data class FrameExtraction(
        val bitmap: Bitmap?,
        val syncWhiteoutRecovered: Boolean,
        val duplicateSyncRecovered: Boolean,
        val syncFingerprint: Long?,
    )

    private fun extractFrame(
        retriever: MediaMetadataRetriever,
        timeMs: Long,
        preferClosest: Boolean,
        previousSyncFingerprint: Long?,
        previousSyncTimeMs: Long?,
    ): FrameExtraction {
        val timeUs = timeMs * 1_000L
        if (preferClosest) {
            return FrameExtraction(
                bitmap = extractClosestFrame(retriever, timeUs),
                syncWhiteoutRecovered = false,
                duplicateSyncRecovered = false,
                syncFingerprint = null,
            )
        }

        val sync = runCatching {
            if (Build.VERSION.SDK_INT >= 27) {
                retriever.getScaledFrameAtTime(
                    timeUs,
                    MediaMetadataRetriever.OPTION_CLOSEST_SYNC,
                    STORYBOARD_WIDTH,
                    STORYBOARD_HEIGHT,
                )
            } else {
                retriever.getFrameAtTime(timeUs, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                    ?.let(::scaleDown)
            }
        }.getOrNull()
        val syncIsWhiteout = sync?.let(::isNearlyWhiteStoryboardFrame) == true
        val syncIsBlack = sync?.let(::isNearlyBlackVideoThumbnail) == true
        val syncFingerprint = sync
            ?.takeUnless { syncIsWhiteout || syncIsBlack }
            ?.let(::storyboardFrameFingerprint)

        if (sync != null && syncFingerprint != null) {
            val duplicateNeedsVerification = shouldVerifyDuplicateStoryboardSync(
                previousFingerprint = previousSyncFingerprint,
                currentFingerprint = syncFingerprint,
                previousTimeMs = previousSyncTimeMs,
                currentTimeMs = timeMs,
            )
            if (!duplicateNeedsVerification) {
                return FrameExtraction(
                    bitmap = sync,
                    syncWhiteoutRecovered = false,
                    duplicateSyncRecovered = false,
                    syncFingerprint = syncFingerprint,
                )
            }

            // A broken/sparse sync index can return the exact same keyframe for widely separated
            // timestamps. Verify only suspicious duplicates with an exact-position decode so the
            // normal fast path, especially SMB, does not gain extra reads.
            val closest = extractClosestFrame(retriever, timeUs)
            val closestFingerprint = closest?.let(::storyboardFrameFingerprint)
            if (
                closest != null &&
                shouldPreferClosestStoryboardFrames(syncFingerprint, closestFingerprint)
            ) {
                sync.recycle()
                return FrameExtraction(
                    bitmap = closest,
                    syncWhiteoutRecovered = false,
                    duplicateSyncRecovered = true,
                    syncFingerprint = syncFingerprint,
                )
            }
            if (closest != null && closest !== sync) closest.recycle()
            return FrameExtraction(
                bitmap = sync,
                syncWhiteoutRecovered = false,
                duplicateSyncRecovered = false,
                syncFingerprint = syncFingerprint,
            )
        }

        val closest = extractClosestFrame(retriever, timeUs)
        if (closest != null) {
            if (closest !== sync) sync?.recycle()
            val recoveredWhiteout = syncIsWhiteout && !isNearlyWhiteStoryboardFrame(closest)
            return FrameExtraction(
                bitmap = closest,
                syncWhiteoutRecovered = recoveredWhiteout,
                duplicateSyncRecovered = false,
                syncFingerprint = syncFingerprint,
            )
        }
        return FrameExtraction(
            bitmap = sync,
            syncWhiteoutRecovered = false,
            duplicateSyncRecovered = false,
            syncFingerprint = syncFingerprint,
        )
    }

'''
          text = text[:start] + replacement + text[end:]

          marker = '''    /**
     * Some codecs/devices return a clipped white bitmap for sync-frame requests even though the
'''
          if marker not in text:
              raise SystemExit('whiteout comment marker not found')
          fingerprint_function = '''    private fun storyboardFrameFingerprint(bitmap: Bitmap): Long {
        if (bitmap.width <= 0 || bitmap.height <= 0) return 0L
        val columns = 8
        val rows = 8
        var hash = 0xcbf29ce484222325UL.toLong()
        for (row in 0 until rows) {
            val y = (((row + 0.5) * bitmap.height) / rows)
                .toInt()
                .coerceIn(0, bitmap.height - 1)
            for (column in 0 until columns) {
                val x = (((column + 0.5) * bitmap.width) / columns)
                    .toInt()
                    .coerceIn(0, bitmap.width - 1)
                val rgb = bitmap.getPixel(x, y) and 0x00ffffff
                hash = (hash xor rgb.toLong()) * 0x100000001b3L
            }
        }
        return hash
    }

'''
          text = text.replace(marker, fingerprint_function + marker, 1)
          target.write_text(text)

          helper = Path('app/src/main/java/app/local1st/files/ui/browser/StoryboardDuplicateFrameDetector.kt')
          helper.parent.mkdir(parents=True, exist_ok=True)
          helper.write_text('''package app.local1st.files.ui.browser

import kotlin.math.abs

internal const val STORYBOARD_DUPLICATE_SYNC_VERIFY_MIN_DISTANCE_MS = 5_000L

internal fun shouldVerifyDuplicateStoryboardSync(
    previousFingerprint: Long?,
    currentFingerprint: Long,
    previousTimeMs: Long?,
    currentTimeMs: Long,
    minDistanceMs: Long = STORYBOARD_DUPLICATE_SYNC_VERIFY_MIN_DISTANCE_MS,
): Boolean {
    if (previousFingerprint == null || previousTimeMs == null) return false
    if (previousFingerprint != currentFingerprint) return false
    return abs(currentTimeMs - previousTimeMs) >= minDistanceMs.coerceAtLeast(0L)
}

internal fun shouldPreferClosestStoryboardFrames(
    syncFingerprint: Long,
    closestFingerprint: Long?,
): Boolean = closestFingerprint != null && syncFingerprint != closestFingerprint
''')

          test = Path('app/src/test/java/app/local1st/files/ui/browser/StoryboardDuplicateFrameDetectorTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package app.local1st.files.ui.browser

import org.junit.Assert.assertFalse
import org.junit.Assert.assertTrue
import org.junit.Test

class StoryboardDuplicateFrameDetectorTest {
    @Test
    fun repeatedSyncFrameFarApartNeedsVerification() {
        assertTrue(
            shouldVerifyDuplicateStoryboardSync(
                previousFingerprint = 42L,
                currentFingerprint = 42L,
                previousTimeMs = 30_000L,
                currentTimeMs = 55_000L,
            ),
        )
    }

    @Test
    fun differentSyncFramesDoNotNeedVerification() {
        assertFalse(
            shouldVerifyDuplicateStoryboardSync(
                previousFingerprint = 41L,
                currentFingerprint = 42L,
                previousTimeMs = 30_000L,
                currentTimeMs = 55_000L,
            ),
        )
    }

    @Test
    fun nearbyDuplicateSyncFrameDoesNotTriggerExtraDecode() {
        assertFalse(
            shouldVerifyDuplicateStoryboardSync(
                previousFingerprint = 42L,
                currentFingerprint = 42L,
                previousTimeMs = 30_000L,
                currentTimeMs = 32_000L,
            ),
        )
    }

    @Test
    fun duplicateSyncWithDifferentExactFrameSwitchesToClosest() {
        assertTrue(shouldPreferClosestStoryboardFrames(42L, 99L))
    }

    @Test
    fun genuinelyStaticExactFrameKeepsSyncFastPath() {
        assertFalse(shouldPreferClosestStoryboardFrames(42L, 42L))
    }

    @Test
    fun failedExactFrameDoesNotSwitchModes() {
        assertFalse(shouldPreferClosestStoryboardFrames(42L, null))
    }
}
''')

          Path('.github/workflows/apply-fix-165.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/browser/StoryboardDuplicateFrameDetector.kt \
                  app/src/mobile/java/app/local1st/files/ui/browser/VideoStoryboardDialog.kt \
                  app/src/test/java/app/local1st/files/ui/browser/StoryboardDuplicateFrameDetectorTest.kt \
                  .github/workflows/apply-fix-165.yml
          git commit -m "Fix repeated storyboard sync frames (#165)"
          git push origin HEAD:fix/165-storyboard-duplicate-frame
