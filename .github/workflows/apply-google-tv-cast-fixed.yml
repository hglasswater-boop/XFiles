name: Apply Google TV and Cast patch fixed

on:
  push:
    branches:
      - feature/google-tv-cast

permissions:
  contents: write

jobs:
  patch:
    name: Patch and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Recover and relax one-shot patcher
        run: |
          mkdir -p .github/scripts
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          workflow = Path('.github/workflows/apply-google-tv-cast.yml').read_text(encoding='utf-8')
          match = re.search(r'PATCH_GZ_B64:\s*(\S+)', workflow)
          if match is None:
              raise SystemExit('embedded patch not found')
          source = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          source = source.replace('if count != 1:', 'if count < 1:', 1)
          source = source.replace('expected exactly one match', 'expected at least one match', 1)
          Path('.github/scripts/apply-google-tv-cast.py').write_text(source, encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 .github/scripts/apply-google-tv-cast.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Commit validated changes
        run: |
          rm -f .github/workflows/apply-google-tv-cast-fixed.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Google TV and Chromecast support"
          git push origin HEAD:${GITHUB_REF_NAME}
