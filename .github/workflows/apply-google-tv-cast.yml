name: Apply Google TV and Cast patch

on:
  push:
    branches:
      - feature/google-tv-cast

permissions:
  contents: write

jobs:
  patch:
    name: Patch and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore one-shot patcher
        env:
          PATCH_GZ_B64: 
        run: |
          mkdir -p .github/scripts
          python3 - <<'PY'
          import base64, gzip, os
          data = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64']))
          open('.github/scripts/apply-google-tv-cast.py', 'wb').write(data)
          PY
      - name: Apply patch
        run: python3 .github/scripts/apply-google-tv-cast.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Google TV and Chromecast support"
          git push origin HEAD:${GITHUB_REF_NAME}
