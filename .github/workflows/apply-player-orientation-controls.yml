name: Apply player orientation controls

on:
  push:
    branches:
      - agent/player-orientation-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/player-orientation-controls
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Patch video player controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()

          old = '''                                        VideoGestureMode.HORIZONTAL_SEEK -> {
                                            scrubbing = true
                                            resumeAfterSeek = player.playWhenReady
                                            player.pause()
                                            baseMs = anchorMs()
                                            baseFrame = frameOf(baseMs)
                                        }'''
          new = '''                                        VideoGestureMode.HORIZONTAL_SEEK -> {
                                            scrubbing = true
                                            resumeAfterSeek = player.playWhenReady
                                            player.pause()
                                            baseMs = anchorMs()
                                            baseFrame = frameOf(baseMs)
                                            // Do not turn the movement used to recognize a drag into
                                            // an immediate seek jump. Start seeking from this point.
                                            accumX = 0f
                                            accumY = 0f
                                        }'''
          if old not in text:
              raise SystemExit('horizontal seek start block not found')
          text = text.replace(old, new, 1)

          old = '''                        if (hasPrevious || hasNext) {
                            TooltipIconButton(
                                stringResource(R.string.next_video),
                                Icons.Outlined.SkipNext,
                                enabled = hasNext,
                            ) {
                                player.seekToNextMediaItem()
                                interactionTick++
                            }
                        }
                    }
                }
            }
        }
    }
}'''
          new = '''                        if (hasPrevious || hasNext) {
                            TooltipIconButton(
                                stringResource(R.string.next_video),
                                Icons.Outlined.SkipNext,
                                enabled = hasNext,
                            ) {
                                player.seekToNextMediaItem()
                                interactionTick++
                            }
                        }
                    }
                    Row(
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.End,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        VideoOrientationQuickControls {
                            interactionTick++
                        }
                    }
                }
            }
        }
    }
}'''
          if old not in text:
              raise SystemExit('bottom controls block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              'private const val SEEK_THROTTLE_MS = 150L',
              'private const val SEEK_THROTTLE_MS = 80L',
              1,
          )
          text = text.replace(
              'private const val TIME_SWIPE_MS_PER_DP = 100L',
              'private const val TIME_SWIPE_MS_PER_DP = 40L',
              1,
          )

          path.write_text(text)
          PY

      - name: Compile patched player
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Commit patch and remove one-shot workflow
        run: |
          set -eu
          rm .github/workflows/apply-player-orientation-controls.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt \
                  app/src/main/java/app/local1st/files/ui/viewer/VideoOrientationControls.kt \
                  .github/workflows/apply-player-orientation-controls.yml
          git commit -m "Improve player seeking and orientation controls"
          git push origin HEAD:agent/player-orientation-controls
