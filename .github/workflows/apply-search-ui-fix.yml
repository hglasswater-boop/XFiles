name: Apply Search UI Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  patch:
    if: github.event.comment.body == '/apply-search-ui-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-search-ui-patch -->
          RUN_ID=${{ github.run_id }}
          STATUS=patching"

      - uses: actions/checkout@v5
        with:
          ref: agent/search-ui-fix
          fetch-depth: 0

      - name: Patch search result selection and layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/browser/PaneView.kt')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import androidx.compose.material3.Text\nimport androidx.compose.runtime.Composable',
              'import androidx.compose.material3.Text\nimport androidx.compose.material3.TriStateCheckbox\nimport androidx.compose.runtime.Composable',
              'TriStateCheckbox import',
          )
          replace_once(
              'import androidx.compose.ui.res.stringResource\nimport androidx.compose.ui.text.input.ImeAction',
              'import androidx.compose.ui.res.stringResource\nimport androidx.compose.ui.state.ToggleableState\nimport androidx.compose.ui.text.input.ImeAction',
              'ToggleableState import',
          )

          replace_once(
              '''    val searchParents = if (showingSearchResults) {
                  searchResults.associate { it.entry.id to it.parentId }
              } else {
                  emptyMap()
              }

              LaunchedEffect(searchActive) {''',
              '''    val searchParents = if (showingSearchResults) {
                  searchResults.associate { it.entry.id to it.parentId }
              } else {
                  emptyMap()
              }
              val searchSelectionTargetMap = if (
                  showingSearchResults && searchPhase == PaneSearchPhase.DONE
              ) {
                  searchSelectionTargets(searchResults.map { it.entry })
              } else {
                  emptyMap()
              }
              val allSearchTargets = searchSelectionTargetMap.values
                  .flatten()
                  .distinctBy { it.id }
              val selectedSearchTargetCount = allSearchTargets.count { it.id in state.selection }
              val searchSelectAllState = when {
                  allSearchTargets.isEmpty() || selectedSearchTargetCount == 0 -> ToggleableState.Off
                  selectedSearchTargetCount == allSearchTargets.size -> ToggleableState.On
                  else -> ToggleableState.Indeterminate
              }

              fun setSearchTargetsSelected(targets: List<XEntry>, selected: Boolean) {
                  val selectedIds = state.selection
                  targets.forEach { target ->
                      if ((target.id in selectedIds) != selected) {
                          controller.toggleSelect(target)
                      }
                  }
              }

              LaunchedEffect(searchActive) {''',
              'search selection state',
          )

          replace_once(
              '''            val headerHeight = if (searchActive) SearchHeaderHeight else CrumbBarHeight

              when {''',
              '''            val headerHeight = if (searchActive) SearchHeaderHeight else CrumbBarHeight
              val listTopInset = statusPad + 8.dp + headerHeight

              when {''',
              'list top inset',
          )

          replace_once(
              '''                    LazyColumn(
                          state = listState,
                          contentPadding = PaddingValues(
                              top = statusPad + 8.dp + headerHeight,
                              bottom = contentPadding.calculateBottomPadding(),
                          ),
                          modifier = Modifier.fillMaxSize(),
                      ) {''',
              '''                    LazyColumn(
                          state = listState,
                          contentPadding = PaddingValues(
                              top = if (searchActive) 0.dp else listTopInset,
                              bottom = contentPadding.calculateBottomPadding(),
                          ),
                          modifier = Modifier
                              .fillMaxSize()
                              .then(
                                  if (searchActive) Modifier.padding(top = listTopInset)
                                  else Modifier,
                              ),
                      ) {''',
              'LazyColumn search viewport',
          )

          remaining_top = 'top = statusPad + 8.dp + headerHeight,'
          if text.count(remaining_top) != 2:
              raise SystemExit(f'placeholder top inset: expected 2 matches, found {text.count(remaining_top)}')
          text = text.replace(remaining_top, 'top = listTopInset,')

          replace_once(
              '''                            val addSmbServer = node.entry.id == SmbTreeFileSystem.ADD_SERVER_ID
                              Column {
                                  EntryRow(
                                      node = node,
                                      selected = node.entry.id in state.selection,''',
              '''                            val addSmbServer = node.entry.id == SmbTreeFileSystem.ADD_SERVER_ID
                              val searchSelectionTargetsForRow = if (showingSearchResults) {
                                  searchSelectionTargetMap[node.entry.id].orEmpty()
                              } else {
                                  emptyList()
                              }
                              val searchRowSelected = showingSearchResults &&
                                  searchSelectionTargetsForRow.isNotEmpty() &&
                                  searchSelectionTargetsForRow.all { it.id in state.selection }
                              Column {
                                  EntryRow(
                                      node = node,
                                      selected = if (showingSearchResults) {
                                          searchRowSelected
                                      } else {
                                          node.entry.id in state.selection
                                      },''',
              'search row selection',
          )

          replace_once(
              '''                                    onToggleSelect = {
                                          onActivate()
                                          controller.toggleSelect(node.entry)
                                      },''',
              '''                                    onToggleSelect = {
                                          onActivate()
                                          if (
                                              showingSearchResults &&
                                              searchSelectionTargetsForRow.isNotEmpty()
                                          ) {
                                              setSearchTargetsSelected(
                                                  searchSelectionTargetsForRow,
                                                  !searchRowSelected,
                                              )
                                          } else {
                                              controller.toggleSelect(node.entry)
                                          }
                                      },''',
              'row toggle selection',
          )

          replace_once(
              '''            if (searchActive) {
                  PaneSearchHeader(
                      query = searchQuery,
                      phase = searchPhase,
                      onQueryChange = ::updateSearchQuery,
                      onClose = onSearchClose,
                  )''',
              '''            if (searchActive) {
                  PaneSearchHeader(
                      query = searchQuery,
                      phase = searchPhase,
                      selectAllState = searchSelectAllState.takeIf {
                          allSearchTargets.isNotEmpty()
                      },
                      onSelectAll = {
                          onActivate()
                          setSearchTargetsSelected(
                              allSearchTargets,
                              searchSelectAllState != ToggleableState.On,
                          )
                      },
                      onQueryChange = ::updateSearchQuery,
                      onClose = onSearchClose,
                  )''',
              'search header select all',
          )

          replace_once(
              '''private fun BoxScope.PaneSearchHeader(
              query: String,
              phase: PaneSearchPhase,
              onQueryChange: (String) -> Unit,
              onClose: () -> Unit,
          ) {''',
              '''private fun BoxScope.PaneSearchHeader(
              query: String,
              phase: PaneSearchPhase,
              selectAllState: ToggleableState? = null,
              onSelectAll: () -> Unit = {},
              onQueryChange: (String) -> Unit,
              onClose: () -> Unit,
          ) {''',
              'search header signature',
          )

          replace_once(
              '''                if (phase == PaneSearchPhase.SEARCHING && query.trim().length >= SEARCH_MIN_QUERY_LENGTH) {
                      LoadingIndicator(Modifier.size(20.dp))
                  }
                  if (query.isNotEmpty()) {''',
              '''                if (phase == PaneSearchPhase.SEARCHING && query.trim().length >= SEARCH_MIN_QUERY_LENGTH) {
                      LoadingIndicator(Modifier.size(20.dp))
                  }
                  if (selectAllState != null) {
                      TriStateCheckbox(
                          state = selectAllState,
                          onClick = onSelectAll,
                      )
                  }
                  if (query.isNotEmpty()) {''',
              'search header checkbox',
          )

          replace_once(
              '''private fun searchEntryWasRemoved(entryId: String, removedIds: Set<String>): Boolean {''',
              '''internal fun searchSelectionTargets(entries: List<XEntry>): Map<String, List<XEntry>> {
              if (entries.isEmpty()) return emptyMap()

              val unique = LinkedHashMap<String, XEntry>()
              entries.forEach { unique[it.id] = it }
              val matchedIds = unique.keys
              val matchedAncestors = HashSet<String>()

              unique.values.forEach { entry ->
                  var current = XId.parent(entry.id)
                  while (current != null) {
                      if (current in matchedIds) matchedAncestors += current
                      current = XId.parent(current)
                  }
              }

              val targets = LinkedHashMap<String, MutableList<XEntry>>()
              unique.values
                  .filterNot { it.id in matchedAncestors }
                  .forEach { terminal ->
                      var current: String? = terminal.id
                      while (current != null) {
                          if (current in matchedIds) {
                              targets.getOrPut(current) { mutableListOf() }.add(terminal)
                          }
                          current = XId.parent(current)
                      }
                  }

              return unique.keys.associateWith { targets[it].orEmpty() }
          }

          private fun searchEntryWasRemoved(entryId: String, removedIds: Set<String>): Boolean {''',
              'search selection helper',
          )

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
          git commit -m "Add search result select-all and fix header overlap"
          git push origin HEAD:agent/search-ui-fix

      - name: Publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-search-ui-patch -->
          RUN_ID=${{ github.run_id }}
          STATUS=ready"
