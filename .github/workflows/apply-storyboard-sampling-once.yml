name: Apply storyboard sampling once

on:
  push:
    paths:
      - '.github/workflows/apply-storyboard-sampling-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch storyboard sampling
        run: python3 .github/scripts/apply_storyboard_sampling.py
      - name: Commit source change
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/mobile/java/app/local1st/files/ui/browser/VideoStoryboardDialog.kt
          git commit -m "fix: improve long-video storyboard coverage"
          git push origin HEAD:main
