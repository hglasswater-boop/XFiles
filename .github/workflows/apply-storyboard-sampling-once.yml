name: Apply storyboard sampling once

on:
  push:
    paths:
      - '.github/workflows/apply-storyboard-sampling-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch storyboard sampling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/mobile/java/app/local1st/files/ui/browser/VideoStoryboardDialog.kt')
          text = path.read_text()

          old_version = '    private const val CACHE_VERSION = 4\n'
          new_version = '    private const val CACHE_VERSION = 5\n'
          if old_version not in text:
              raise SystemExit('CACHE_VERSION marker not found')
          text = text.replace(old_version, new_version, 1)

          old = '''    private fun sampleTimes(
              durationMs: Long,
              count: Int,
              minSpacingMs: Long,
          ): List<Long> {
              if (durationMs <= 0L || count <= 0) return emptyList()
              val requestedCount = count.coerceAtLeast(1)
              val start = durationMs * 5L / 100L
              val end = durationMs * 95L / 100L
              val span = (end - start).coerceAtLeast(0L)
              val safeSpacingMs = minSpacingMs.coerceAtLeast(1_000L)
              val maxCountForSpacing = (span / safeSpacingMs + 1L)
                  .coerceAtLeast(1L)
                  .coerceAtMost(Int.MAX_VALUE.toLong())
                  .toInt()
              val actualCount = minOf(requestedCount, maxCountForSpacing)
              if (actualCount == 1) return listOf(start + span / 2L)
              return List(actualCount) { index ->
                  start + (span * index / (actualCount - 1L))
              }
          }
'''

          new = '''    private fun sampleTimes(
              durationMs: Long,
              count: Int,
              minSpacingMs: Long,
          ): List<Long> {
              if (durationMs <= 0L || count <= 0) return emptyList()
              val requestedCount = count.coerceAtLeast(1)
              val safeSpacingMs = minSpacingMs.coerceAtLeast(1_000L)

              // Do not throw away the first/last 5% on long videos. That made a 3-hour video
              // start around 9 minutes even with 120 storyboard frames. Keep only a small edge
              // inset to avoid a black first frame / end-of-file seek while still showing the
              // actual beginning and ending of the video.
              val edgeInset = minOf(
                  durationMs / 10L,
                  maxOf(5_000L, minOf(30_000L, durationMs / 100L)),
              )
              val start = edgeInset.coerceAtLeast(0L)
              val end = (durationMs - edgeInset).coerceAtLeast(start)
              val span = (end - start).coerceAtLeast(0L)

              val maxSlot = span / safeSpacingMs
              val maxCountForSpacing = (maxSlot + 1L)
                  .coerceAtLeast(1L)
                  .coerceAtMost(Int.MAX_VALUE.toLong())
                  .toInt()
              val actualCount = minOf(requestedCount, maxCountForSpacing)
              if (actualCount == 1) return listOf(start + span / 2L)

              // Bias roughly the first quarter of the storyboard toward the beginning, but keep
              // every remaining frame spread across the rest of the duration. Using spacing slots
              // guarantees the user's minimum interval even where the curve is densest.
              val lastIndex = actualCount - 1
              val times = ArrayList<Long>(actualCount)
              var previousSlot = -1L
              for (index in 0..lastIndex) {
                  val fraction = index.toDouble() / lastIndex.toDouble()
                  val curvedFraction = fraction * (0.35 + 0.65 * fraction)
                  val desiredSlot = (maxSlot.toDouble() * curvedFraction).toLong()
                  val minSlot = previousSlot + 1L
                  val maxAllowedSlot = maxSlot - (lastIndex - index).toLong()
                  val slot = desiredSlot.coerceIn(minSlot, maxAllowedSlot)
                  times += start + slot * safeSpacingMs
                  previousSlot = slot
              }
              return times
          }
'''

          if old not in text:
              raise SystemExit('sampleTimes block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit source change and remove one-shot workflow
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/apply-storyboard-sampling-once.yml
          git add app/src/mobile/java/app/local1st/files/ui/browser/VideoStoryboardDialog.kt .github/workflows/apply-storyboard-sampling-once.yml
          git commit -m "fix: improve long-video storyboard coverage"
          git push origin HEAD:main
