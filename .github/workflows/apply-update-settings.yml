name: Apply update settings patch

on:
  push:
    branches:
      - feature/update-settings-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/update-settings-ui
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-update-settings.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git commit -m "Add self-update settings UI"
          git push origin HEAD:feature/update-settings-ui
