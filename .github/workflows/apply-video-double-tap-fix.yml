name: Apply video double tap fix

on:
  push:
    branches:
      - fix/video-double-tap-controls

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip video-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/video-double-tap-controls
          fetch-depth: 0

      - name: Patch video double tap behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()
          old = '''                        onDoubleTap = { offset ->\n                            val xFraction = offset.x / size.width\n'''
          new = '''                        onDoubleTap = { offset ->\n                            // Double-tap is reserved for seeking and must not reveal playback controls.\n                            controlsVisible = false\n                            val xFraction = offset.x / size.width\n'''
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('Expected double-tap handler was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          git commit -m "Fix video double-tap controls [skip video-fix]"
          git push origin HEAD:fix/video-double-tap-controls
