name: Compact player controls once

on:
  push:
    branches:
      - agent/player-orientation-controls
    paths:
      - .github/workflows/compact-player-controls-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Put rotation controls on playback row
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()

          old_open = '''                    Row(
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.Center,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
'''
          new_open = '''                    Box(Modifier.fillMaxWidth()) {
                        Row(
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.Center,
                            modifier = Modifier.align(Alignment.Center),
                        ) {
'''
          if old_open not in text:
              raise SystemExit('playback row opening not found')
          text = text.replace(old_open, new_open, 1)

          old_tail = '''                    }
                    Row(
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.End,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        VideoOrientationQuickControls(orientationController) {
                            interactionTick++
                        }
                    }
'''
          new_tail = '''                        }
                        Row(
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.End,
                            modifier = Modifier.align(Alignment.CenterEnd),
                        ) {
                            VideoOrientationQuickControls(orientationController) {
                                interactionTick++
                            }
                        }
                    }
'''
          if old_tail not in text:
              raise SystemExit('orientation row tail not found')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text)
          PY

          rm .github/workflows/compact-player-controls-once.yml
          git diff --check

      - name: Verify debug build
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Commit compact layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Compact player controls"
          git push origin HEAD:${{ github.ref_name }}
