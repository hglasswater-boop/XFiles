name: Compact player controls once

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch player layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          s = p.read_text()
          a = '''                    Row(
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.Center,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
'''
          b = '''                    Box(Modifier.fillMaxWidth()) {
                        Row(
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.Center,
                            modifier = Modifier.align(Alignment.Center),
                        ) {
'''
          if a not in s:
              raise SystemExit('playback row not found')
          s = s.replace(a, b, 1)
          a = '''                    }
                    Row(
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.End,
                        modifier = Modifier.fillMaxWidth(),
                    ) {
                        VideoOrientationQuickControls(orientationController) {
                            interactionTick++
                        }
                    }
'''
          b = '''                        }
                        Row(
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.End,
                            modifier = Modifier.align(Alignment.CenterEnd),
                        ) {
                            VideoOrientationQuickControls(orientationController) {
                                interactionTick++
                            }
                        }
                    }
'''
          if a not in s:
              raise SystemExit('orientation row not found')
          p.write_text(s.replace(a, b, 1))
          PY
          rm .github/workflows/compact-player-controls-once.yml
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build
        run: ./gradlew :app:assembleDebug

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Compact player controls"
          git push origin HEAD:agent/player-orientation-controls
