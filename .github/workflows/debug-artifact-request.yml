name: Retrievable Debug APK

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  apk:
    if: github.event.comment.body == '/build-debug-artifact'
    name: Build retrievable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-debug-artifact -->
          DEBUG_ARTIFACT_RUN_ID=${{ github.run_id }}
          DEBUG_ARTIFACT_RUN_NUMBER=${{ github.run_number }}
          STATUS=building"

      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Build signed debug APK
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Name debug APK
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          NAME="XFiles-${VERSION}-b${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-debug-artifact -->
          DEBUG_ARTIFACT_RUN_ID=${{ github.run_id }}
          DEBUG_ARTIFACT_RUN_NUMBER=${{ github.run_number }}
          DEBUG_APK=${{ steps.apk.outputs.name }}
          STATUS=ready"
