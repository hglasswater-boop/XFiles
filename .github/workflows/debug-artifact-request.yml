name: Retrievable Debug APK

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apk:
    if: github.event.comment.body == '/build-debug-artifact'
    name: Build retrievable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-debug-artifact -->
          DEBUG_ARTIFACT_RUN_ID=${{ github.run_id }}
          DEBUG_ARTIFACT_RUN_NUMBER=${{ github.run_number }}
          STATUS=building"

      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Build signed debug APK
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name debug APK
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          NAME="XFiles-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-debug-artifact -->
          DEBUG_ARTIFACT_RUN_ID=${{ github.run_id }}
          DEBUG_ARTIFACT_RUN_NUMBER=${{ github.run_number }}
          DEBUG_BUILD_NUMBER=${{ steps.build_number.outputs.value }}
          DEBUG_APK=${{ steps.apk.outputs.name }}
          STATUS=ready"

  patch-new-folder-path:
    if: github.event.comment.body == '/apply-new-folder-path'
    name: Apply new folder path UI
    runs-on: ubuntu-latest
    steps:
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-new-folder-path -->
          RUN_ID=${{ github.run_id }}
          STATUS=patching"

      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Patch dialog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/dialogs/Dialogs.kt')
          text = path.read_text()

          old = '''        is DialogRequest.NewFolder -> NameDialog(
            title = stringResource(R.string.new_folder),
            initial = "",
            confirmLabel = stringResource(R.string.create),
            onDismiss = dismiss,
            onConfirm = { vm.performNewFolder(req.parent, it) },
        )'''
          new = '''        is DialogRequest.NewFolder -> {
            val destinationPath = when (req.parent.scheme) {
                XId.SCHEME_SMB -> Graph.smbConnections.displayPathForId(req.parent.id)
                XId.SCHEME_ROOT -> "root:${req.parent.path}"
                else -> req.parent.path
            }
            NameDialog(
                title = stringResource(R.string.new_folder),
                initial = "",
                confirmLabel = stringResource(R.string.create),
                destinationPath = destinationPath,
                onDismiss = dismiss,
                onConfirm = { vm.performNewFolder(req.parent, it) },
            )
        }'''
          if old not in text:
              raise SystemExit('NewFolder block not found')
          text = text.replace(old, new, 1)

          old = '''    confirmLabel: String,
    selectStem: Boolean = false,'''
          new = '''    confirmLabel: String,
    destinationPath: String? = null,
    selectStem: Boolean = false,'''
          if old not in text:
              raise SystemExit('NameDialog parameters not found')
          text = text.replace(old, new, 1)

          old = '''        text = {
            OutlinedTextField(
                value = value,
                onValueChange = { value = it },
                singleLine = true,
                modifier = Modifier.focusRequester(focusRequester).fillMaxWidth(),
            )
        },'''
          new = '''        text = {
            Column {
                destinationPath?.let { path ->
                    Text(
                        text = path,
                        style = androidx.compose.material3.MaterialTheme.typography.bodySmall
                            .copy(fontFamily = FontFamily.Monospace),
                        color = androidx.compose.material3.MaterialTheme.colorScheme.onSurfaceVariant,
                        modifier = Modifier.padding(bottom = 8.dp),
                    )
                }
                OutlinedTextField(
                    value = value,
                    onValueChange = { value = it },
                    singleLine = true,
                    modifier = Modifier.focusRequester(focusRequester).fillMaxWidth(),
                )
            }
        },'''
          if old not in text:
              raise SystemExit('NameDialog text field block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Commit patch
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- app/src/main/java/app/local1st/files/ui/dialogs/Dialogs.kt
          git commit -m "Show destination path when creating folders"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-new-folder-path -->
          RUN_ID=${{ github.run_id }}
          COMMIT=${{ steps.commit.outputs.sha }}
          STATUS=ready"
