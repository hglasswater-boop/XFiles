name: Retrievable Debug APK

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apk:
    if: github.event.comment.body == '/build-debug-artifact'
    name: Build retrievable debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-debug-artifact -->
          DEBUG_ARTIFACT_RUN_ID=${{ github.run_id }}
          DEBUG_ARTIFACT_RUN_NUMBER=${{ github.run_number }}
          STATUS=building"

      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch 10-second tap seek control suppression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()
          old1 = '''    fun performTapSeek(deltaSeconds: Int) {
        controlsVisible = false
        seekGate.request(clampMs(anchorMs() + deltaSeconds * 1000L))
        updateTapSeekLabel(deltaSeconds)
        interactionTick++
    }
'''
          new1 = '''    fun performTapSeek(deltaSeconds: Int) {
        controlsVisible = false
        // Mark the tap-seek sequence before asking ExoPlayer to seek. A seek can briefly make
        // playback report as not playing, and that state must not resurrect the playback chrome.
        updateTapSeekLabel(deltaSeconds)
        seekGate.request(clampMs(anchorMs() + deltaSeconds * 1000L))
        interactionTick++
    }
'''
          old2 = '''    LaunchedEffect(playing) {
        if (!playing && !scrubbing && sliderPos == null) controlsVisible = true
    }
'''
          new2 = '''    LaunchedEffect(playing) {
        // A 10-second tap seek can transiently report !playing while the new position is loaded.
        // Keep the chrome hidden for that seek sequence; a normal pause still reveals controls.
        if (!playing && !scrubbing && sliderPos == null && tapSeekLabel == null) {
            controlsVisible = true
        }
    }
'''
          assert old1 in text, 'performTapSeek anchor not found'
          assert old2 in text, 'playing effect anchor not found'
          path.write_text(text.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
          grep -n "Mark the tap-seek sequence" app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          grep -n "tapSeekLabel == null" app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt

      - name: Commit source fix
        id: source_commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          git commit -m "Keep controls hidden after 10s tap seek"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Build signed debug APKs
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name debug APKs
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          MOBILE_NAME="XFiles-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          TV_NAME="XFiles-TV-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$MOBILE_NAME"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$TV_NAME"
          echo "mobile_name=$MOBILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tv_name=$TV_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-debug-apks
          path: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Replace rolling debug release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          CODE=$(curl -sS -o "$RUNNER_TEMP/debug-latest.json" -w '%{http_code}' -H "$AUTH" -H "$ACCEPT" "https://api.github.com/repos/${REPO}/releases/tags/debug-latest")
          if [ "$CODE" = "200" ]; then
            ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$RUNNER_TEMP/debug-latest.json")
            if [ -n "$ID" ]; then
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "https://api.github.com/repos/${REPO}/releases/${ID}"
            fi
          fi
          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" -o /dev/null -w '' "https://api.github.com/repos/${REPO}/git/refs/tags/debug-latest" || true

      - name: Publish rolling debug release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: debug-latest
          target_commitish: ${{ steps.source_commit.outputs.sha }}
          name: XFiles debug build ${{ steps.build_number.outputs.value }}
          prerelease: true
          body: Signed mobile and Google TV debug APKs with the 10-second tap-seek control suppression fix.
          files: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}

      - name: Publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-debug-artifact -->
          DEBUG_ARTIFACT_RUN_ID=${{ github.run_id }}
          DEBUG_ARTIFACT_RUN_NUMBER=${{ github.run_number }}
          DEBUG_BUILD_NUMBER=${{ steps.build_number.outputs.value }}
          DEBUG_APK=${{ steps.apk.outputs.mobile_name }}
          DEBUG_TV_APK=${{ steps.apk.outputs.tv_name }}
          STATUS=ready"
