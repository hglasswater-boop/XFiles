name: Delete merged transfer branch now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/delete-copy-move-branch-now.yml'

permissions:
  contents: write

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete agent/copy-move-speed-eta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/agent/copy-move-speed-eta"
