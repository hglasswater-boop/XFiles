name: Cleanup merged branches (manual)

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Only delete merged branches whose name starts with this prefix. Leave blank for all."
        required: false
        default: "agent/"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete branches fully merged into main
        shell: bash
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          deleted=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"

            case "$branch" in
              main|HEAD) continue ;;
            esac

            if [[ -n "$PREFIX" && "$branch" != "$PREFIX"* ]]; then
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          echo "Deleted $deleted merged branch(es)."
