name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      prefix:
        description: "Only delete merged branches whose name starts with this prefix. Leave blank for all."
        required: false
        default: "agent/"

permissions:
  contents: write

jobs:
  delete-merged-pr-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete merged PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            echo "Deleting merged PR branch: $HEAD_REF"
            git push origin --delete "$HEAD_REF"
          else
            echo "Branch already deleted: $HEAD_REF"
          fi

  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete branches fully merged into main
        shell: bash
        env:
          PREFIX: ${{ inputs.prefix }}
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          deleted=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"

            case "$branch" in
              main|HEAD) continue ;;
            esac

            if [[ -n "$PREFIX" && "$branch" != "$PREFIX"* ]]; then
              continue
            fi

            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "Deleting merged branch: $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)

          echo "Deleted $deleted merged branch(es)."
