name: Delete merged work branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Delete merged work branches
        run: |
          git push origin --delete \
            agent/fix-smb-fast-move-dispatch \
            agent/search-full-filename \
            agent/smb-server-side-move
