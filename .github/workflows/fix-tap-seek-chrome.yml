name: Fix tap seek chrome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tap-seek-chrome.yml'

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch tap seek chrome suppression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()

          old = '''    fun performTapSeek(deltaSeconds: Int) {\n        controlsVisible = false\n        seekGate.request(clampMs(anchorMs() + deltaSeconds * 1000L))\n        updateTapSeekLabel(deltaSeconds)\n        interactionTick++\n    }'''
          new = '''    fun performTapSeek(deltaSeconds: Int) {\n        controlsVisible = false\n        // Mark the tap-seek sequence before asking ExoPlayer to seek. A seek can briefly make\n        // playback report as not playing, and that state must not resurrect the playback chrome.\n        updateTapSeekLabel(deltaSeconds)\n        seekGate.request(clampMs(anchorMs() + deltaSeconds * 1000L))\n        interactionTick++\n    }'''
          assert old in text, 'performTapSeek anchor not found'
          text = text.replace(old, new, 1)

          old = '''    LaunchedEffect(playing) {\n        if (!playing && !scrubbing && sliderPos == null) controlsVisible = true\n    }'''
          new = '''    LaunchedEffect(playing) {\n        // A 10-second tap seek can transiently report !playing while the new position is loaded.\n        // Keep the chrome hidden for that seek sequence; a normal pause still reveals controls.\n        if (!playing && !scrubbing && sliderPos == null && tapSeekLabel == null) {\n            controlsVisible = true\n        }\n    }'''
          assert old in text, 'playing effect anchor not found'
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          grep -F 'Mark the tap-seek sequence before asking ExoPlayer to seek' app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          grep -F 'tapSeekLabel == null' app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Build signed debug APKs
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name APKs
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          MOBILE_NAME="XFiles-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          TV_NAME="XFiles-TV-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$MOBILE_NAME"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$TV_NAME"
          echo "mobile_name=$MOBILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tv_name=$TV_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-tap-seek-chrome-fix
          path: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          git rm .github/workflows/fix-tap-seek-chrome.yml
          git commit -m 'Keep controls hidden after 10s tap seek'
          git push origin HEAD:main
