name: Fix update installer handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-update-handoff.yml'

permissions:
  contents: write

jobs:
  fix-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch update handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/mobile/java/app/local1st/files/EditionUpdater.kt')
          text = path.read_text()

          state_old = '''    var downloading by remember { mutableStateOf(false) }\n    var errorMessage by remember { mutableStateOf<String?>(null) }'''
          state_new = '''    var downloading by remember { mutableStateOf(false) }\n    var preparingInstall by remember { mutableStateOf(false) }\n    var errorMessage by remember { mutableStateOf<String?>(null) }'''
          assert text.count(state_old) == 2, f'expected 2 update state blocks, got {text.count(state_old)}'
          text = text.replace(state_old, state_new)

          text = text.replace(
              'onDismissRequest = { if (!downloading) onDismiss() },',
              'onDismissRequest = { if (!downloading && !preparingInstall) onDismiss() },',
              1,
          )
          text = text.replace(
              'onDismissRequest = { if (!downloading) release = null },',
              'onDismissRequest = { if (!downloading && !preparingInstall) release = null },',
              1,
          )

          old_action = '''                    scope.launch {\n                        downloading = true\n                        errorMessage = null\n                        runCatching { MobileSelfUpdater.downloadAndValidate(context, available) }\n                            .onSuccess { MobileSelfUpdater.launchInstaller(context, it) }\n                            .onFailure { errorMessage = it.message ?: it.javaClass.simpleName }\n                        downloading = false\n                    }'''
          settings_action = '''                    scope.launch {\n                        downloading = true\n                        preparingInstall = false\n                        errorMessage = null\n                        val apk = runCatching {\n                            MobileSelfUpdater.downloadAndValidate(context, available)\n                        }.getOrElse { error ->\n                            downloading = false\n                            errorMessage = error.message ?: error.javaClass.simpleName\n                            return@launch\n                        }\n                        downloading = false\n                        preparingInstall = true\n                        runCatching {\n                            withContext(Dispatchers.IO) {\n                                MobileSelfUpdater.launchInstaller(context, apk)\n                            }\n                        }.onSuccess {\n                            onDismiss()\n                        }.onFailure { error ->\n                            preparingInstall = false\n                            errorMessage = error.message ?: error.javaClass.simpleName\n                        }\n                    }'''
          startup_action = '''                    scope.launch {\n                        downloading = true\n                        preparingInstall = false\n                        errorMessage = null\n                        val apk = runCatching {\n                            MobileSelfUpdater.downloadAndValidate(context, available)\n                        }.getOrElse { error ->\n                            downloading = false\n                            errorMessage = error.message ?: error.javaClass.simpleName\n                            return@launch\n                        }\n                        downloading = false\n                        preparingInstall = true\n                        runCatching {\n                            withContext(Dispatchers.IO) {\n                                MobileSelfUpdater.launchInstaller(context, apk)\n                            }\n                        }.onSuccess {\n                            release = null\n                        }.onFailure { error ->\n                            preparingInstall = false\n                            errorMessage = error.message ?: error.javaClass.simpleName\n                        }\n                    }'''
          assert text.count(old_action) == 2, f'expected 2 old action blocks, got {text.count(old_action)}'
          text = text.replace(old_action, settings_action, 1)
          text = text.replace(old_action, startup_action, 1)

          old_label = '''                    stringResource(\n                        if (downloading) R.string.mobile_update_downloading\n                        else R.string.mobile_update_install,\n                    ),'''
          new_label = '''                    stringResource(\n                        when {\n                            downloading -> R.string.mobile_update_downloading\n                            preparingInstall -> R.string.mobile_update_preparing_install\n                            else -> R.string.mobile_update_install\n                        },\n                    ),'''
          assert text.count(old_label) == 2, f'expected 2 update button labels, got {text.count(old_label)}'
          text = text.replace(old_label, new_label)

          assert text.count('enabled = !downloading,') == 4, text.count('enabled = !downloading,')
          text = text.replace('enabled = !downloading,', 'enabled = !downloading && !preparingInstall,')

          path.write_text(text)

          for rel, old, new in [
              (
                  'app/src/mobile/res/values/strings.xml',
                  '    <string name="mobile_update_downloading">Downloading…</string>\n',
                  '    <string name="mobile_update_downloading">Downloading…</string>\n    <string name="mobile_update_preparing_install">Preparing update…</string>\n',
              ),
              (
                  'app/src/mobile/res/values-ja/strings.xml',
                  '    <string name="mobile_update_downloading">ダウンロード中…</string>\n',
                  '    <string name="mobile_update_downloading">ダウンロード中…</string>\n    <string name="mobile_update_preparing_install">更新を準備中…</string>\n',
              ),
          ]:
              p = Path(rel)
              s = p.read_text()
              assert old in s, f'string anchor missing in {rel}'
              p.write_text(s.replace(old, new, 1))
          PY

          grep -n 'preparingInstall' app/src/mobile/java/app/local1st/files/EditionUpdater.kt
          grep -n 'withContext(Dispatchers.IO)' app/src/mobile/java/app/local1st/files/EditionUpdater.kt
          grep -n 'mobile_update_preparing_install' app/src/mobile/res/values/strings.xml app/src/mobile/res/values-ja/strings.xml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Build signed debug APKs
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name APKs
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          MOBILE_NAME="XFiles-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          TV_NAME="XFiles-TV-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$MOBILE_NAME"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$TV_NAME"
          echo "mobile_name=$MOBILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tv_name=$TV_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-update-handoff-fix
          path: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Commit verified fix and remove helper
        id: source_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/mobile/java/app/local1st/files/EditionUpdater.kt app/src/mobile/res/values/strings.xml app/src/mobile/res/values-ja/strings.xml
          git rm .github/workflows/fix-update-handoff.yml
          git commit -m 'Fix update installer handoff state'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Replace rolling debug release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          CODE=$(curl -sS -o "$RUNNER_TEMP/debug-latest.json" -w '%{http_code}' -H "$AUTH" -H "$ACCEPT" "https://api.github.com/repos/${REPO}/releases/tags/debug-latest")
          if [ "$CODE" = "200" ]; then
            ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$RUNNER_TEMP/debug-latest.json")
            if [ -n "$ID" ]; then
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "https://api.github.com/repos/${REPO}/releases/${ID}"
            fi
          fi
          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" -o /dev/null -w '' "https://api.github.com/repos/${REPO}/git/refs/tags/debug-latest" || true

      - name: Publish rolling debug release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: debug-latest
          target_commitish: ${{ steps.source_commit.outputs.sha }}
          name: XFiles debug build ${{ steps.build_number.outputs.value }}
          prerelease: true
          body: Signed mobile and Google TV debug APKs with the update installer handoff state fix.
          files: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}
