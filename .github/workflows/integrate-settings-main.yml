name: Integrate settings branch with main

on:
  push:
    branches: [agent/settings-backup]
  workflow_dispatch:

concurrency:
  group: integrate-settings-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and resolve known overlaps
        run: |
          set -u
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff origin/main || echo "::notice::Resolving expected merge conflicts"

          git checkout HEAD -- .github/workflows/personal-fork-ci.yml || {
            echo "::error::Failed to keep branch Debug CI"; exit 1;
          }
          git checkout origin/main -- app/src/main/java/app/local1st/files/ui/browser/EntryRow.kt || {
            echo "::error::Failed to keep main EntryRow"; exit 1;
          }
          git checkout HEAD -- app/src/main/java/app/local1st/files/ui/dialogs/Dialogs.kt || {
            echo "::error::Failed to restore branch Dialogs"; exit 1;
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/dialogs/Dialogs.kt')
          text = path.read_text()

          anchor = 'import app.local1st.files.core.fs.XId\n'
          media = '''import app.local1st.files.core.media.VideoMetadata
          import app.local1st.files.core.media.VideoMetadataReader
          import app.local1st.files.core.media.formatVideoBitrate
          import app.local1st.files.core.media.formatVideoDuration
          import app.local1st.files.core.media.formatVideoFrameRate
          '''
          if text.count(anchor) != 1:
              print(f'::error::XId import anchor count={text.count(anchor)}')
              raise SystemExit(1)
          text = text.replace(anchor, anchor + media, 1)

          anchor = 'import app.local1st.files.core.util.ComponentType\n'
          category = 'import app.local1st.files.core.util.FileCategory\n'
          if text.count(anchor) != 1:
              print(f'::error::ComponentType import anchor count={text.count(anchor)}')
              raise SystemExit(1)
          text = text.replace(anchor, anchor + category, 1)

          start_marker = '        is DialogRequest.Details -> AlertDialog('
          end_marker = '\n\n        is DialogRequest.FolderSort ->'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              print(f'::error::Details markers missing start={start} end={end}')
              raise SystemExit(1)

          details = '''        is DialogRequest.Details -> {
              val isVideo = FileTypes.categoryOf(req.entry.name, req.entry.mime) == FileCategory.VIDEO
              val videoMetadata by produceState<VideoMetadata?>(
                  initialValue = null,
                  req.entry.id,
                  req.entry.mtime,
                  req.entry.size,
              ) {
                  if (isVideo) value = VideoMetadataReader.read(req.entry)
              }
              AlertDialog(
                  onDismissRequest = dismiss,
                  title = { Text(req.entry.name) },
                  text = {
                      Column {
                          Text(stringResource(R.string.location, req.entry.id))
                          if (!req.entry.isDir) {
                              Text(stringResource(R.string.size, Format.bytes(req.entry.size)))
                          }
                          Text(stringResource(R.string.modified, Format.dateTime(req.entry.mtime)))
                          req.entry.mime?.let { Text(stringResource(R.string.file_type, it)) }
                          videoMetadata?.let { metadata ->
                              if (metadata.width != null && metadata.height != null) {
                                  Text(
                                      stringResource(
                                          R.string.video_resolution,
                                          "${metadata.width} × ${metadata.height}",
                                      ),
                                  )
                              }
                              metadata.frameRate?.let {
                                  Text(
                                      stringResource(
                                          R.string.video_frame_rate,
                                          formatVideoFrameRate(it),
                                      ),
                                  )
                              }
                              metadata.durationMs?.let {
                                  Text(
                                      stringResource(
                                          R.string.video_duration,
                                          formatVideoDuration(it),
                                      ),
                                  )
                              }
                              metadata.codec?.let {
                                  Text(stringResource(R.string.video_codec, it))
                              }
                              metadata.bitrate?.let {
                                  Text(
                                      stringResource(
                                          R.string.video_bitrate,
                                          formatVideoBitrate(it),
                                      ),
                                  )
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = dismiss) { Text(stringResource(R.string.close)) }
                  },
              )
          }'''
          text = text[:start] + details + text[end:]
          path.write_text(text)
          PY
          rc=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

          git rm .github/workflows/integrate-settings-main.yml || {
            echo "::error::Failed to remove temporary workflow"; exit 1;
          }
          git add -A

          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "::error::Unresolved merge conflicts: $unresolved"
            exit 1
          fi

          if ! git diff --cached --check >/tmp/diff-check.txt 2>&1; then
            echo "::error::git diff --check failed: $(cat /tmp/diff-check.txt)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test merged tree
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"
          XFILES_KEYSTORE="$RUNNER_TEMP/xfiles-personal.jks" ./gradlew :app:assembleDebug :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Commit resolved merge
        run: |
          set -eu
          git commit -m "Merge main into settings backup branch"
          git push origin HEAD:agent/settings-backup
