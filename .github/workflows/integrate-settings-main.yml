name: Integrate settings branch with main

on:
  push:
    branches: [agent/settings-backup]
  workflow_dispatch:

concurrency:
  group: integrate-settings-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge main and resolve known overlaps
        run: |
          set -eu
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff origin/main || true

          # Keep the reusable Debug CI from this branch.
          git checkout HEAD -- .github/workflows/personal-fork-ci.yml

          # Keep main's newer, shared video-metadata thumbnail implementation.
          git checkout origin/main -- app/src/main/java/app/local1st/files/ui/browser/EntryRow.kt

          # Start from the settings/context-menu dialog implementation and add main's video details.
          git checkout HEAD -- app/src/main/java/app/local1st/files/ui/dialogs/Dialogs.kt
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/dialogs/Dialogs.kt')
          text = path.read_text()

          old_imports = '''import app.local1st.files.core.fs.XId
          import app.local1st.files.core.prefs.ContextMenuOrderSettings
          '''
          new_imports = '''import app.local1st.files.core.fs.XId
          import app.local1st.files.core.media.VideoMetadata
          import app.local1st.files.core.media.VideoMetadataReader
          import app.local1st.files.core.media.formatVideoBitrate
          import app.local1st.files.core.media.formatVideoDuration
          import app.local1st.files.core.media.formatVideoFrameRate
          import app.local1st.files.core.prefs.ContextMenuOrderSettings
          '''
          if text.count(old_imports) != 1:
              raise SystemExit(f'media import anchor count={text.count(old_imports)}')
          text = text.replace(old_imports, new_imports, 1)

          old_category_imports = '''import app.local1st.files.core.util.ComponentType
          import app.local1st.files.core.util.FileTypes
          '''
          new_category_imports = '''import app.local1st.files.core.util.ComponentType
          import app.local1st.files.core.util.FileCategory
          import app.local1st.files.core.util.FileTypes
          '''
          if text.count(old_category_imports) != 1:
              raise SystemExit(f'category import anchor count={text.count(old_category_imports)}')
          text = text.replace(old_category_imports, new_category_imports, 1)

          old_details = '''        is DialogRequest.Details -> AlertDialog(
              onDismissRequest = dismiss,
              title = { Text(req.entry.name) },
              text = {
                  Column {
                      Text(stringResource(R.string.location, req.entry.id))
                      if (!req.entry.isDir) {
                          Text(stringResource(R.string.size, Format.bytes(req.entry.size)))
                      }
                      Text(stringResource(R.string.modified, Format.dateTime(req.entry.mtime)))
                      req.entry.mime?.let { Text(stringResource(R.string.file_type, it)) }
                  }
              },
              confirmButton = {
                  TextButton(onClick = dismiss) { Text(stringResource(R.string.close)) }
              },
          )
          '''
          new_details = '''        is DialogRequest.Details -> {
              val isVideo = FileTypes.categoryOf(req.entry.name, req.entry.mime) == FileCategory.VIDEO
              val videoMetadata by produceState<VideoMetadata?>(
                  initialValue = null,
                  req.entry.id,
                  req.entry.mtime,
                  req.entry.size,
              ) {
                  if (isVideo) value = VideoMetadataReader.read(req.entry)
              }
              AlertDialog(
                  onDismissRequest = dismiss,
                  title = { Text(req.entry.name) },
                  text = {
                      Column {
                          Text(stringResource(R.string.location, req.entry.id))
                          if (!req.entry.isDir) {
                              Text(stringResource(R.string.size, Format.bytes(req.entry.size)))
                          }
                          Text(stringResource(R.string.modified, Format.dateTime(req.entry.mtime)))
                          req.entry.mime?.let { Text(stringResource(R.string.file_type, it)) }
                          videoMetadata?.let { metadata ->
                              if (metadata.width != null && metadata.height != null) {
                                  Text(
                                      stringResource(
                                          R.string.video_resolution,
                                          "${metadata.width} × ${metadata.height}",
                                      ),
                                  )
                              }
                              metadata.frameRate?.let {
                                  Text(
                                      stringResource(
                                          R.string.video_frame_rate,
                                          formatVideoFrameRate(it),
                                      ),
                                  )
                              }
                              metadata.durationMs?.let {
                                  Text(
                                      stringResource(
                                          R.string.video_duration,
                                          formatVideoDuration(it),
                                      ),
                                  )
                              }
                              metadata.codec?.let {
                                  Text(stringResource(R.string.video_codec, it))
                              }
                              metadata.bitrate?.let {
                                  Text(
                                      stringResource(
                                          R.string.video_bitrate,
                                          formatVideoBitrate(it),
                                      ),
                                  )
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = dismiss) { Text(stringResource(R.string.close)) }
                  },
              )
          }
          '''
          if text.count(old_details) != 1:
              raise SystemExit(f'details block anchor count={text.count(old_details)}')
          text = text.replace(old_details, new_details, 1)
          path.write_text(text)
          PY

          # This helper workflow is temporary and must not land in main.
          git rm .github/workflows/integrate-settings-main.yml
          git add -A

          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:"
            git ls-files -u
            exit 1
          fi
          git diff --cached --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test merged tree
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"
          XFILES_KEYSTORE="$RUNNER_TEMP/xfiles-personal.jks" ./gradlew :app:assembleDebug :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Commit resolved merge
        run: |
          set -eu
          git commit -m "Merge main into settings backup branch"
          git push origin HEAD:agent/settings-backup
