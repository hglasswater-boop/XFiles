name: One-shot search hit navigation patch

on:
  push:
    branches:
      - agent/search-full-filename
    paths:
      - .github/workflows/oneshot-search-hit-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep reveal scroll requests until browser is visible
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/app/local1st/files/ui/browser/PaneController.kt'); s=p.read_text(); s=s.replace('import kotlinx.coroutines.cancel\\n','import kotlinx.coroutines.cancel\\nimport kotlinx.coroutines.channels.Channel\\n',1); s=s.replace('import kotlinx.coroutines.flow.map\\n','import kotlinx.coroutines.flow.map\\nimport kotlinx.coroutines.flow.receiveAsFlow\\n',1); old='    /** A row the pane list should bring on screen (consumed by the UI). */\\n    val scrollTo = MutableSharedFlow<ScrollRequest>(extraBufferCapacity = 1)'; new='    /** A row the pane list should bring on screen. Keep the latest request while the UI is off-screen. */\\n    private val scrollRequests = Channel<ScrollRequest>(Channel.CONFLATED)\\n    val scrollTo = scrollRequests.receiveAsFlow()'; assert old in s, 'scrollTo declaration not found'; s=s.replace(old,new,1); assert 'scrollTo.tryEmit(' in s, 'scrollTo.tryEmit not found'; s=s.replace('scrollTo.tryEmit(','scrollRequests.trySend('); p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/app/local1st/files/ui/browser/PaneView.kt'); s=p.read_text(); s=s.replace('import kotlinx.coroutines.flow.first\\n','import kotlinx.coroutines.flow.collectLatest\\nimport kotlinx.coroutines.flow.first\\n',1); old='    LaunchedEffect(controller, listState) {\\n        controller.scrollTo.collect { request ->\\n            val index = controller.state.value.nodes.indexOfFirst { it.entry.id == request.id }\\n            if (index < 0) return@collect\\n            if (request.animate) listState.animateScrollToItem(index) else listState.scrollToItem(index)\\n        }\\n    }'; new='    LaunchedEffect(controller, listState) {\\n        controller.scrollTo.collectLatest { request ->\\n            // Keep this request until the browser is visible again and the expanded path has\\n            // propagated through the flattened tree.\\n            val ready = controller.state.first { state ->\\n                state.nodes.any { it.entry.id == request.id }\\n            }\\n            val index = ready.nodes.indexOfFirst { it.entry.id == request.id }\\n            if (index < 0) return@collectLatest\\n            if (request.animate) listState.animateScrollToItem(index) else listState.scrollToItem(index)\\n        }\\n    }'; assert old in s, 'PaneView scroll collector not found'; s=s.replace(old,new,1); p.write_text(s)"
          git diff --check
          git diff -- app/src/main/java/app/local1st/files/ui/browser/PaneController.kt app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/browser/PaneController.kt app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
          git commit -m "Reveal tapped search results in browser"
          git push origin HEAD:agent/search-full-filename
