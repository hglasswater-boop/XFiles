name: One-shot search hit navigation patch

on:
  push:
    branches:
      - agent/search-full-filename
    paths:
      - .github/workflows/oneshot-search-hit-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep reveal scroll requests until browser is visible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pane = Path('app/src/main/java/app/local1st/files/ui/browser/PaneController.kt')
          text = pane.read_text()

          text = text.replace(
              'import kotlinx.coroutines.cancel\n',
              'import kotlinx.coroutines.cancel\nimport kotlinx.coroutines.channels.Channel\n',
              1,
          )
          text = text.replace(
              'import kotlinx.coroutines.flow.map\n',
              'import kotlinx.coroutines.flow.map\nimport kotlinx.coroutines.flow.receiveAsFlow\n',
              1,
          )

          old = '    /** A row the pane list should bring on screen (consumed by the UI). */\n    val scrollTo = MutableSharedFlow<ScrollRequest>(extraBufferCapacity = 1)'
          new = '    /** A row the pane list should bring on screen. Keep the latest request while the UI is off-screen. */\n    private val scrollRequests = Channel<ScrollRequest>(Channel.CONFLATED)\n    val scrollTo = scrollRequests.receiveAsFlow()'
          if old not in text:
              raise SystemExit('scrollTo declaration not found')
          text = text.replace(old, new, 1)

          count = text.count('scrollTo.tryEmit(')
          if count < 1:
              raise SystemExit('no scrollTo.tryEmit calls found')
          text = text.replace('scrollTo.tryEmit(', 'scrollRequests.trySend(')
          pane.write_text(text)

          view = Path('app/src/main/java/app/local1st/files/ui/browser/PaneView.kt')
          text = view.read_text()
          text = text.replace(
              'import kotlinx.coroutines.flow.first\n',
              'import kotlinx.coroutines.flow.collectLatest\nimport kotlinx.coroutines.flow.first\n',
              1,
          )
          old = '''    LaunchedEffect(controller, listState) {
        controller.scrollTo.collect { request ->
            val index = controller.state.value.nodes.indexOfFirst { it.entry.id == request.id }
            if (index < 0) return@collect
            if (request.animate) listState.animateScrollToItem(index) else listState.scrollToItem(index)
        }
    }'''
          new = '''    LaunchedEffect(controller, listState) {
        controller.scrollTo.collectLatest { request ->
            // A reveal can be requested while SearchScreen is still the composed destination.
            // The channel preserves it until this PaneView exists again. Also wait until the
            // expanded path has propagated through the flattened tree before calculating the row.
            val ready = controller.state.first { state ->
                state.nodes.any { it.entry.id == request.id }
            }
            val index = ready.nodes.indexOfFirst { it.entry.id == request.id }
            if (index < 0) return@collectLatest
            if (request.animate) listState.animateScrollToItem(index) else listState.scrollToItem(index)
        }
    }'''
          if old not in text:
              raise SystemExit('PaneView scroll collector not found')
          text = text.replace(old, new, 1)
          view.write_text(text)
          PY
          git diff --check
          git diff -- app/src/main/java/app/local1st/files/ui/browser/PaneController.kt app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/browser/PaneController.kt app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
          git commit -m "Reveal tapped search results in browser"
          git push origin HEAD:agent/search-full-filename
