name: One-shot transfer tree toggle patch

on:
  push:
    branches:
      - agent/search-full-filename
    paths:
      - .github/workflows/oneshot-transfer-toggle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow collapsing folders during transfer destination selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/app/local1st/files/ui/main/MainScreen.kt')
          text = p.read_text()
          old = 'pane.expand(entry)'
          new = 'pane.toggleExpand(entry)'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 transfer expand calls, found {count}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- app/src/main/java/app/local1st/files/ui/main/MainScreen.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/main/MainScreen.kt
          git commit -m "Allow collapsing folders while choosing transfer destination"
          git push origin HEAD:agent/search-full-filename
