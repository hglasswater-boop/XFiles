name: Apply folder creation time display

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-folder-created-time.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Patch folder metadata display
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              text2 = text.replace(old, new, 1)
              p.write_text(text2)

          replace_once(
              "app/src/main/java/app/local1st/files/core/fs/XEntry.kt",
              '''    /** True for a favorite shown as a top-level shortcut root. */
              val pinned: Boolean = false,
          ) {''',
              '''    /** True for a favorite shown as a top-level shortcut root. */
              val pinned: Boolean = false,
              /** Creation/birth time in epoch millis when the backing filesystem reports it. */
              val creationTime: Long = 0L,
          ) {''',
          )

          replace_once(
              "app/src/main/java/app/local1st/files/core/fs/LocalFileSystem.kt",
              '''            mtime = attrs?.lastModifiedTime()?.toMillis() ?: 0L,
              mime = if (isDir) null else FileTypes.mimeOf(name),''',
              '''            mtime = attrs?.lastModifiedTime()?.toMillis() ?: 0L,
              creationTime = attrs?.creationTime()?.toMillis() ?: 0L,
              mime = if (isDir) null else FileTypes.mimeOf(name),''',
          )

          replace_once(
              "app/src/main/java/app/local1st/files/core/fs/SmbFileSystem.kt",
              '''                        mtime = info.lastWriteTime.toEpochMillis(),
                          mime = if (isDir) null else FileTypes.mimeOf(info.fileName),''',
              '''                        mtime = info.lastWriteTime.toEpochMillis(),
                          creationTime = info.creationTime.toEpochMillis(),
                          mime = if (isDir) null else FileTypes.mimeOf(info.fileName),''',
          )

          entry_row = "app/src/main/java/app/local1st/files/ui/browser/EntryRow.kt"
          replace_once(
              entry_row,
              '''            val details = node.error ?: entryDetails(node)
              if (details.isNotEmpty()) {
                  Text(
                      details,
                      style = if (entry.isDir && node.error == null) {
                          MaterialTheme.typography.labelSmall
                      } else {
                          MaterialTheme.typography.bodySmall
                      },
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      color = if (node.error != null) MaterialTheme.colorScheme.error
                      else MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }''',
              '''            if (entry.isDir && node.error == null && entry.badge == null) {
                  FolderDetailsRow(node = node, loadFolderCount = true)
              } else {
                  val details = node.error ?: entryDetails(node)
                  if (details.isNotEmpty()) {
                      Text(
                          details,
                          style = MaterialTheme.typography.bodySmall,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          color = if (node.error != null) MaterialTheme.colorScheme.error
                          else MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
              }''',
          )

          replace_once(
              entry_row,
              '''            val details = entryDetails(node, loadFolderCount = false)
              if (details.isNotEmpty()) {
                  Text(
                      details,
                      style = if (entry.isDir) {
                          MaterialTheme.typography.labelSmall
                      } else {
                          MaterialTheme.typography.bodySmall
                      },
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
              }''',
              '''            if (entry.isDir && entry.badge == null) {
                  FolderDetailsRow(node = node, loadFolderCount = false)
              } else {
                  val details = entryDetails(node, loadFolderCount = false)
                  if (details.isNotEmpty()) {
                      Text(
                          details,
                          style = MaterialTheme.typography.bodySmall,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                  }
              }''',
          )

          marker = '''@Composable
          private fun entryDetails(node: TreeNode, loadFolderCount: Boolean = true): String {'''
          helper = '''@Composable
          private fun FolderDetailsRow(node: TreeNode, loadFolderCount: Boolean) {
              val entry = node.entry
              val counts = entryDetails(node, loadFolderCount)
              val timestamp = entry.creationTime.takeIf { it > 0L } ?: entry.mtime
              val created = if (timestamp > 0L) Format.dateTime(timestamp) else ""
              if (counts.isEmpty() && created.isEmpty()) return

              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  modifier = Modifier.fillMaxWidth(),
              ) {
                  if (counts.isNotEmpty()) {
                      Text(
                          counts,
                          style = MaterialTheme.typography.labelSmall,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier.weight(1f),
                      )
                  } else {
                      Spacer(Modifier.weight(1f))
                  }
                  if (created.isNotEmpty()) {
                      Text(
                          created,
                          style = MaterialTheme.typography.labelSmall,
                          maxLines = 1,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier.padding(start = 8.dp),
                      )
                  }
              }
          }

          @Composable
          private fun entryDetails(node: TreeNode, loadFolderCount: Boolean = true): String {'''
          replace_once(entry_row, marker, helper)
          PY

          git rm .github/workflows/patch-folder-created-time.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/core/fs/XEntry.kt \
                  app/src/main/java/app/local1st/files/core/fs/LocalFileSystem.kt \
                  app/src/main/java/app/local1st/files/core/fs/SmbFileSystem.kt \
                  app/src/main/java/app/local1st/files/ui/browser/EntryRow.kt
          git commit -m "Show folder creation time beside counts"
          git push origin HEAD:main
