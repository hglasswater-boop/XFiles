name: Patch Search Select All Layout

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/search-select-all-layout
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Move master checkbox above result checkboxes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/app/local1st/files/ui/browser/PaneView.kt')
          text = path.read_text()

          if 'item(key = "search-select-all")' not in text:
              match = re.search(
                  r'(?m)^(\s*)items\(\n\s*count = displayNodes\.size,',
                  text,
              )
              if match is None:
                  raise SystemExit('displayNodes items() marker not found')
              indent = match.group(1)
              block = f'''{indent}if (showingSearchResults && allSearchTargets.isNotEmpty()) {{\n{indent}    item(key = "search-select-all") {{\n{indent}        Box(\n{indent}            contentAlignment = Alignment.CenterEnd,\n{indent}            modifier = Modifier\n{indent}                .fillMaxWidth()\n{indent}                .padding(horizontal = 4.dp),\n{indent}        ) {{\n{indent}            Box(\n{indent}                contentAlignment = Alignment.Center,\n{indent}                modifier = Modifier.width(36.dp),\n{indent}            ) {{\n{indent}                TriStateCheckbox(\n{indent}                    state = searchSelectAllState,\n{indent}                    onClick = {{\n{indent}                        onActivate()\n{indent}                        setSearchTargetsSelected(\n{indent}                            allSearchTargets,\n{indent}                            searchSelectAllState != ToggleableState.On,\n{indent}                        )\n{indent}                    }},\n{indent}                )\n{indent}            }}\n{indent}        }}\n{indent}    }}\n{indent}}}\n'''
              text = text[:match.start()] + block + text[match.start():]

          pattern = re.compile(
              r'\n\s*selectAllState = searchSelectAllState\.takeIf \{ allSearchTargets\.isNotEmpty\(\) \},'
              r'\n\s*onSelectAll = \{.*?\n\s*\},(?=\n\s*onQueryChange = ::updateSearchQuery,)',
              re.S,
          )
          text, count = pattern.subn('', text, count=1)
          if count == 0 and 'selectAllState = searchSelectAllState.takeIf' in text:
              raise SystemExit('failed to remove select-all args from search header')

          path.write_text(text)
          PY
      - name: Compile
        run: ./gradlew :app:compileDebugKotlin -PbuildNumber=379
      - name: Commit if changed
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Move search select-all above result checkboxes"
            git push origin HEAD:agent/search-select-all-layout
          fi
