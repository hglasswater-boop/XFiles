name: Apply TV player focus patch

on:
  push: {}

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run TV focus patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch TV player focus behavior
        run: python3 .github/scripts/patch_tv_focus.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt app/src/tv/java/app/local1st/files/ui/viewer/MediaViewer.kt
          git commit -m "Fix TV seek bar focus and settings visibility"
          git push origin HEAD:main
