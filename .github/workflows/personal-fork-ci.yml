name: Apply early seek resume fix

on:
  push:
  workflow_dispatch:

concurrency:
  group: early-seek-fix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-build-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve intended playback state while seeking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()
          replacements = [
              ('var wasPlaying = false', 'var resumeAfterSeek = false'),
              ('if (wasPlaying && !frameMode) player.play()', 'if (resumeAfterSeek && !frameMode) player.play()'),
              ('wasPlaying = player.isPlaying', 'resumeAfterSeek = player.playWhenReady'),
              ('sliderWasPlaying = player.isPlaying', 'sliderWasPlaying = player.playWhenReady'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{old!r}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Compile and test
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Name debug APK
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          APK_NAME="XFiles-${BASE_VERSION}-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ github.run_number }}-signed-debug
          path: ${{ steps.apk_name.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated seek fix
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          git commit -m "Preserve playback state while seeking"
          git push
