name: Debug CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Rust SMB JNI libraries
        run: bash .github/scripts/build-rust-smb-android.sh

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Select debug package identity
        id: package_mode
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "diagnostic=false" >> "$GITHUB_OUTPUT"
            echo "mobile_package=app.local1st.files" >> "$GITHUB_OUTPUT"
          else
            echo "diagnostic=true" >> "$GITHUB_OUTPUT"
            echo "mobile_package=app.local1st.files.diagnostic" >> "$GITHUB_OUTPUT"
          fi

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Assemble stable-signed debug APKs
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app:assembleDebug \
            -PbuildNumber=${{ steps.build_number.outputs.value }} \
            -PxfilesDiagnosticBuild=${{ steps.package_mode.outputs.diagnostic }}

      - name: Verify APK package identities
        run: |
          set -eu
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -x "$AAPT"
          MOBILE_APK=app/build/outputs/apk/debug/app-debug.apk
          MOBILE_PACKAGE=$($AAPT dump badging "$MOBILE_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$MOBILE_PACKAGE" = "${{ steps.package_mode.outputs.mobile_package }}"

      - name: Name debug APKs
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          if [ "${{ steps.package_mode.outputs.diagnostic }}" = "true" ]; then
            MOBILE_NAME="XFiles-Diagnostic-${BASE_VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          else
            MOBILE_NAME="XFiles-${BASE_VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$MOBILE_NAME"
          echo "mobile_name=$MOBILE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APKs
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ steps.build_number.outputs.value }}-signed-debug
          path: ${{ steps.apk_name.outputs.mobile_name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish debug-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          bash .github/scripts/publish-rolling-release.sh \
            debug-latest \
            "${{ steps.apk_name.outputs.mobile_name }}" \
            "XFiles ${{ steps.apk_name.outputs.version }} debug build ${{ steps.build_number.outputs.value }}" \
            "Signed phone debug APK built from main at $GITHUB_SHA."

      - name: Publish diagnostic-latest release
        if: startsWith(github.ref, 'refs/heads/diagnose/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          bash .github/scripts/publish-rolling-release.sh \
            diagnostic-latest \
            "${{ steps.apk_name.outputs.mobile_name }}" \
            "XFiles diagnostic build ${{ steps.build_number.outputs.value }}" \
            "Side-by-side diagnostic APK built from $GITHUB_REF_NAME at $GITHUB_SHA. They do not replace the normal XFiles package."

      - name: Record debug run metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BODY=$(cat <<EOF
          <!-- xfiles-debug-run -->
          DEBUG_CI_RUN_ID=${{ github.run_id }}
          DEBUG_CI_RUN_NUMBER=${{ github.run_number }}
          DEBUG_BUILD_NUMBER=${{ steps.build_number.outputs.value }}
          DEBUG_APK=${{ steps.apk_name.outputs.mobile_name }}
          COMMIT=$GITHUB_SHA
          EOF
          )
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="$BODY"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test rolling release publisher (offline fake GitHub CLI)
        run: bash .github/scripts/test-publish-rolling-release.sh
      - name: Run phone unit tests
        run: ./gradlew :app:testDebugUnitTest

  release-lint:
    name: Release lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run fatal release lint
        run: ./gradlew :app:lintVitalRelease

  emulator:
    name: Android emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Rust SMB JNI libraries
        run: bash .github/scripts/build-rust-smb-android.sh

      - name: Run mobile instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -partition-size 2048
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload emulator test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-results-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 1
