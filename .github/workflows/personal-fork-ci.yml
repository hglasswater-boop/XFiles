name: Apply inline transfer and seek fix

on:
  push:
  workflow_dispatch:

concurrency:
  group: inline-transfer-seek-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-build-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply browser transfer mode and seek fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ----- Inline copy/move destination selection -----
          vm_path = Path('app/src/main/java/app/local1st/files/ui/main/MainViewModel.kt')
          vm = vm_path.read_text()

          vm, n = re.subn(
              r'\n    private fun showDestinationPicker\(transfer: PendingTransfer\) \{\n        navigation\.navigate\(AppScreen\.DestinationPicker\(transfer\)\)\n    \}\n',
              '\n    /** Copy/move destination selection stays in the two-pane browser. */\n'
              '    val pendingTransfer = MutableStateFlow<PendingTransfer?>(null)\n',
              vm,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'showDestinationPicker replacement count={n}')

          start = vm.index("    /** Copies or moves the active pane's selection directly into the other pane's folder. */")
          end = vm.index('    fun requestDelete(', start)
          transfer_code = '''    /** All copy/move entry points now start inline destination-selection mode. */
          fun copySelection(move: Boolean, sources: List<XEntry> = activeCtrl.selectionEntries()) {
              chooseTransferDestination(move = move, sources = sources)
          }

          fun chooseTransferDestination(
              move: Boolean,
              sources: List<XEntry> = activeCtrl.selectionEntries(),
          ) {
              if (sources.isEmpty()) return
              val sourcePane = activePane.value
              pendingTransfer.value = PendingTransfer(
                  sources = sources,
                  move = move,
                  startDirId = panes[1 - sourcePane].state.value.focusedDirId,
                  sourcePane = sourcePane,
              )
          }

          fun cancelTransferDestination() {
              val transfer = pendingTransfer.value ?: return
              pendingTransfer.value = null
              activePane.value = transfer.sourcePane
          }

          fun confirmTransferCurrentDestination() {
              val destDir = activeCtrl.focusedDirEntry()
              if (destDir == null) {
                  validDestinationOrNotify(null)
                  return
              }
              confirmTransfer(destDir)
          }

          fun confirmTransfer(destDir: XEntry) {
              val transfer = pendingTransfer.value ?: return
              val validDest = validDestinationOrNotify(destDir) ?: return
              Graph.opEngine.submit(FileOp.Copy(transfer.sources, validDest, transfer.move))
              pendingTransfer.value = null
              panes[transfer.sourcePane].clearSelection()
          }

          '''
          vm = vm[:start] + transfer_code + vm[end:]

          model_start = vm.index('/** A copy or move whose non-pane destination is being chosen. */')
          vm = vm[:model_start] + '''/** A copy or move waiting for explicit confirmation in the browser. */
          data class PendingTransfer(
              val sources: List<XEntry>,
              val move: Boolean,
              val startDirId: String?,
              val sourcePane: Int = 0,
          )
          '''
          vm_path.write_text(vm)

          screen_path = Path('app/src/main/java/app/local1st/files/ui/main/MainScreen.kt')
          screen = screen_path.read_text()

          marker = '    val activePane by vm.activePane.collectAsStateWithLifecycle()\n'
          if marker not in screen:
              raise SystemExit('activePane marker missing')
          screen = screen.replace(
              marker,
              marker + '    val pendingTransfer by vm.pendingTransfer.collectAsStateWithLifecycle()\n',
              1,
          )

          marker = '    val canUseOtherPane = isFileOperationDestination(otherPaneDestination)\n'
          if marker not in screen:
              raise SystemExit('canUseOtherPane marker missing')
          screen = screen.replace(
              marker,
              marker +
              '    val transferDestination = vm.activeCtrl.focusedDirEntry()\n' +
              '    val transferDestinationName = paneLocationName(transferDestination, activeState.focusedDirId)\n' +
              '    val canConfirmTransfer = isFileOperationDestination(transferDestination)\n',
              1,
          )

          labels_start = screen.index('    val copyTargetLabel = if (canUseOtherPane) {')
          labels_end = screen.index('    val compressTargetLabel = if (canUseOtherPane) {', labels_start)
          screen = screen[:labels_start] + (
              '    val copyTargetLabel = stringResource(R.string.copy_to)\n'
              '    val moveTargetLabel = stringResource(R.string.move_to)\n'
          ) + screen[labels_end:]

          old_back = '''    BackHandler(enabled = selectionCount > 0) {
              vm.activeCtrl.clearSelection()
          }
          '''
          if old_back not in screen:
              raise SystemExit('BackHandler marker missing')
          screen = screen.replace(
              old_back,
              '''    BackHandler(enabled = pendingTransfer != null) {
              vm.cancelTransferDestination()
          }
          BackHandler(enabled = pendingTransfer == null && selectionCount > 0) {
              vm.activeCtrl.clearSelection()
          }
          ''',
              1,
          )

          screen = screen.replace(
              'onOpenEntry = { vm.openEntry(pane, it) },',
              '''onOpenEntry = { entry ->
                                  if (pendingTransfer == null || entry.isContainer) {
                                      vm.openEntry(pane, entry)
                                  }
                              },''',
          )
          screen = screen.replace(
              'onEntryMenu = { vm.dialog.value = DialogRequest.EntryMenu(it) },',
              '''onEntryMenu = { entry ->
                                  if (pendingTransfer == null) {
                                      vm.dialog.value = DialogRequest.EntryMenu(entry)
                                  }
                              },''',
          )

          toolbar_marker = '        // Signature X-plore action bar, reimagined as an Expressive floating toolbar.\n'
          toolbar_start = screen.index(toolbar_marker)
          toolbar_end = screen.index('        val requiredPanes = if (wideLayout)', toolbar_start)
          existing_toolbar = screen[toolbar_start:toolbar_end]
          existing_toolbar = existing_toolbar.replace(
              toolbar_marker,
              toolbar_marker + '        if (pendingTransfer == null) {\n',
              1,
          )
          existing_toolbar = existing_toolbar.rstrip() + '''
              } else {
                  val transfer = pendingTransfer
                  if (transfer != null) {
                      HorizontalFloatingToolbar(
                          expanded = true,
                          modifier = Modifier
                              .align(Alignment.BottomCenter)
                              .windowInsetsPadding(WindowInsets.navigationBarsIgnoringVisibility)
                              .offset(y = (-24).dp),
                          content = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  TooltipIconButton(
                                      label = stringResource(R.string.cancel),
                                      icon = Icons.Outlined.Close,
                                  ) { vm.cancelTransferDestination() }
                                  Text(
                                      "${transfer.sources.size}",
                                      style = MaterialTheme.typography.titleMedium,
                                  )
                                  Text(
                                      transferDestinationName,
                                      style = MaterialTheme.typography.labelLarge,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      modifier = Modifier
                                          .padding(horizontal = 6.dp)
                                          .widthIn(max = 140.dp),
                                  )
                                  TooltipIconButton(
                                      label = if (transfer.move) {
                                          "ここへ移動: $transferDestinationName"
                                      } else {
                                          "ここへコピー: $transferDestinationName"
                                      },
                                      icon = if (transfer.move) {
                                          Icons.AutoMirrored.Outlined.DriveFileMove
                                      } else {
                                          Icons.Outlined.ContentCopy
                                      },
                                      enabled = canConfirmTransfer,
                                  ) { vm.confirmTransferCurrentDestination() }
                              }
                          },
                      )
                  }
              }

          '''
          screen = screen[:toolbar_start] + existing_toolbar + screen[toolbar_end:]
          screen_path.write_text(screen)

          # ----- Early-seek playback preservation -----
          player_path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          player = player_path.read_text()
          replacements = {
              'var wasPlaying = false': 'var resumeAfterSeek = false',
              'if (wasPlaying && !frameMode) player.play()': 'if (resumeAfterSeek && !frameMode) player.play()',
              'wasPlaying = player.isPlaying': 'resumeAfterSeek = player.playWhenReady',
              'sliderWasPlaying = player.isPlaying': 'sliderWasPlaying = player.playWhenReady',
          }
          for old, new in replacements.items():
              count = player.count(old)
              if count != 1:
                  raise SystemExit(f'VideoPlayer marker {old!r} count={count}')
              player = player.replace(old, new, 1)
          player_path.write_text(player)

          # Remove stale full-screen destination from navigation host; the old screen file may remain
          # for compatibility, but no copy/move action navigates to it anymore.
          git_paths = [vm_path, screen_path, player_path]
          for path in git_paths:
              if not path.exists():
                  raise SystemExit(f'missing {path}')
          PY

          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Compile and test
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Name debug APK
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          APK_NAME="XFiles-${BASE_VERSION}-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ github.run_number }}-signed-debug
          path: ${{ steps.apk_name.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated changes
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/app/local1st/files/ui/main/MainViewModel.kt \
            app/src/main/java/app/local1st/files/ui/main/MainScreen.kt \
            app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt
          git commit -m "Choose transfer destinations inline and preserve playback on seek"
          git push
