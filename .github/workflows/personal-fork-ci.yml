name: Debug CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Branch builds consume the latest cache from main without spending time uploading it.
          # Main refreshes the Gradle dependency/build cache for subsequent runs.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Rust SMB JNI libraries
        run: bash .github/scripts/build-rust-smb-android.sh

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      # Build once, already signed. The previous workflow assembled both flavors once to warm
      # app/build and then assembled the exact same tasks again with signing enabled.
      - name: Assemble stable-signed debug APKs
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name debug APKs
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          MOBILE_NAME="XFiles-${BASE_VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          TV_NAME="XFiles-TV-${BASE_VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$MOBILE_NAME"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$TV_NAME"
          echo "mobile_name=$MOBILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tv_name=$TV_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ steps.build_number.outputs.value }}-signed-debug
          path: |
            ${{ steps.apk_name.outputs.mobile_name }}
            ${{ steps.apk_name.outputs.tv_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish debug-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete debug-latest --cleanup-tag -y 2>/dev/null || true
          gh release create debug-latest \
            "${{ steps.apk_name.outputs.mobile_name }}" \
            "${{ steps.apk_name.outputs.tv_name }}" \
            --target "$GITHUB_SHA" \
            --title "XFiles ${{ steps.apk_name.outputs.version }} debug build ${{ steps.build_number.outputs.value }}" \
            --prerelease \
            --notes "Signed mobile and Google TV debug APKs built from main at $GITHUB_SHA."

      - name: Record debug run metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BODY=$(cat <<EOF
          <!-- xfiles-debug-run -->
          DEBUG_CI_RUN_ID=${{ github.run_id }}
          DEBUG_CI_RUN_NUMBER=${{ github.run_number }}
          DEBUG_BUILD_NUMBER=${{ steps.build_number.outputs.value }}
          DEBUG_APK=${{ steps.apk_name.outputs.mobile_name }}
          DEBUG_TV_APK=${{ steps.apk_name.outputs.tv_name }}
          COMMIT=$GITHUB_SHA
          EOF
          )
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="$BODY"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run unit tests for both editions
        run: ./gradlew :app:testMobileDebugUnitTest :app:testTvDebugUnitTest

  emulator:
    name: Android emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Rust SMB JNI libraries
        run: bash .github/scripts/build-rust-smb-android.sh

      - name: Run mobile instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew :app:connectedMobileDebugAndroidTest --stacktrace

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-results-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
