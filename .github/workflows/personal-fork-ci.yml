name: Debug CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-player-runtime-fixes:
    name: Apply player runtime fixes
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Keep orientation and PiP logic alive outside auto-hidden controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt')
          text = path.read_text()

          state_needle = '    var showPlayerSettings by remember { mutableStateOf(false) }\n\n    SystemBarsHidden(hidden = !controlsVisible)'
          state_replacement = '''    var showPlayerSettings by remember { mutableStateOf(false) }

    // These controllers belong to the player screen itself, not the auto-hiding controls panel.
    // Hiding the controls must never dispose orientation lock or PiP eligibility.
    val orientationController = rememberVideoOrientationController()
    VideoPictureInPicture(
        player = player,
        playing = playing,
        title = entry.name,
        onModeChanged = { inPip ->
            if (inPip) {
                controlsVisible = false
                showPlayerSettings = false
            }
        },
    )

    SystemBarsHidden(hidden = !controlsVisible)'''
          if text.count(state_needle) != 1:
              raise SystemExit('VideoPlayer state insertion point not found exactly once')
          text = text.replace(state_needle, state_replacement)

          controls_needle = '                        VideoOrientationQuickControls {\n'
          controls_replacement = '                        VideoOrientationQuickControls(orientationController) {\n'
          if text.count(controls_needle) != 1:
              raise SystemExit('Orientation controls call not found exactly once')
          text = text.replace(controls_needle, controls_replacement)

          path.write_text(text)
          PY

      - name: Restore normal CI workflow before committing
        run: git checkout origin/main -- .github/workflows/personal-fork-ci.yml

      - name: Commit runtime fixes
        id: commit
        run: |
          set -eu
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt .github/workflows/personal-fork-ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "Keep player rotation and PiP active when controls hide"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  apk:
    name: Build APK
    needs: apply-player-runtime-fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.apply-player-runtime-fixes.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Dependency/build-cache state from main is useful, but do not save Gradle home
          # after the signed build because signing credentials are visible to Gradle then.
          cache-read-only: true

      # GitHub-hosted runners are disposable. Preserve the project-local state that Gradle and
      # Kotlin need for true incremental compilation between personal debug builds. This cache is
      # explicitly saved before any signing secret is exposed to Gradle.
      - name: Restore incremental Android build state
        id: incremental-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle
            app/build
            vendor/bundletool-shaded/build
          key: xfiles-incremental-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'vendor/**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            xfiles-incremental-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'vendor/**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-

      - name: Warm incremental debug build
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Save incremental Android build state
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle
            app/build
            vendor/bundletool-shaded/build
          key: ${{ steps.incremental-restore.outputs.cache-primary-key }}

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      # The warm build above does the expensive compilation without secrets. Reconfiguring with
      # the stable key should only invalidate packaging/signing work; compiled code remains warm.
      - name: Assemble stable-signed debug APK
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Name debug APK
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          APK_NAME="XFiles-${BASE_VERSION}-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ github.run_number }}-signed-debug
          path: ${{ steps.apk_name.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  test:
    name: Unit tests
    needs: apply-player-runtime-fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.apply-player-runtime-fixes.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }}
