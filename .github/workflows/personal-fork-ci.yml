name: Apply player follow-up

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply follow-up patch
        run: python scripts/player_followup_patch.py

      - name: Restore normal workflow and remove patch helper
        run: |
          git checkout origin/main -- .github/workflows/personal-fork-ci.yml
          rm scripts/player_followup_patch.py
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }}

      - name: Commit verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finish player PiP and persist video metadata cache"
          git push origin HEAD:${{ github.ref_name }}
