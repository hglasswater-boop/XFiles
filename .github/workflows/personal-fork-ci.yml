name: Debug CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate SMB display cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/player-orientation-controls
          fetch-depth: 2

      - name: Apply friendly SMB display paths
        run: python3 .github/apply-smb-friendly-paths.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate APK compile and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Restore normal CI and commit source changes
        shell: bash
        run: |
          set -eu
          git show HEAD^:.github/workflows/personal-fork-ci.yml > .github/workflows/personal-fork-ci.yml
          git rm .github/apply-smb-friendly-paths.py
          git add .github/workflows/personal-fork-ci.yml app/src/main/java app/src/test/java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Hide SMB internal ids in user-facing paths"
          git push origin HEAD:agent/player-orientation-controls
