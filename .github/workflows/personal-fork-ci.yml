name: Apply video duration overlay

on:
  push:
  workflow_dispatch:

concurrency:
  group: video-duration-overlay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-build-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add video duration overlay
        run: |
          cat > app/src/main/java/app/local1st/files/core/thumb/VideoDurationResolver.kt <<'EOF'
          package app.local1st.files.core.thumb

          import android.media.MediaDataSource
          import android.media.MediaMetadataRetriever
          import android.os.ParcelFileDescriptor
          import app.local1st.files.core.fs.SmbRandomAccessFile
          import app.local1st.files.core.fs.XEntry
          import app.local1st.files.core.fs.XId
          import app.local1st.files.core.fs.priv.PrivilegedAccess
          import app.local1st.files.di.Graph
          import java.util.LinkedHashMap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.sync.Semaphore
          import kotlinx.coroutines.sync.withPermit
          import kotlinx.coroutines.withContext

          /** Resolves video duration only for thumbnails that actually display it. */
          object VideoDurationResolver {
              private data class CacheKey(val id: String, val mtime: Long, val size: Long)

              private const val FAILED = -1L
              private const val MAX_CACHE_ENTRIES = 256
              private val semaphore = Semaphore(3)
              private val cache = object : LinkedHashMap<CacheKey, Long>(MAX_CACHE_ENTRIES, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<CacheKey, Long>?): Boolean =
                      size > MAX_CACHE_ENTRIES
              }

              suspend fun durationMs(entry: XEntry): Long? {
                  val key = CacheKey(entry.id, entry.mtime, entry.size)
                  synchronized(cache) {
                      cache[key]?.let { return it.takeIf { value -> value > 0L } }
                  }
                  return semaphore.withPermit {
                      synchronized(cache) {
                          cache[key]?.let { return@withPermit it.takeIf { value -> value > 0L } }
                      }
                      val value = withContext(Dispatchers.IO) { readDuration(entry) }
                      synchronized(cache) { cache[key] = value ?: FAILED }
                      value
                  }
              }

              private fun readDuration(entry: XEntry): Long? {
                  val retriever = MediaMetadataRetriever()
                  var descriptor: ParcelFileDescriptor? = null
                  var smbSource: DurationSmbMediaDataSource? = null
                  return try {
                      when {
                          entry.scheme == XId.SCHEME_SMB -> {
                              if (entry.size <= 0L) return null
                              val source = DurationSmbMediaDataSource(entry)
                              smbSource = source
                              retriever.setDataSource(source)
                          }
                          entry.localPath != null -> retriever.setDataSource(entry.localPath)
                          entry.scheme == XId.SCHEME_ROOT -> {
                              val transport = PrivilegedAccess.fdTransport() ?: return null
                              val fd = transport.openFd(entry.path, write = false) ?: return null
                              descriptor = fd
                              retriever.setDataSource(fd.fileDescriptor)
                          }
                          else -> return null
                      }
                      retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)
                          ?.toLongOrNull()
                          ?.takeIf { it > 0L }
                  } catch (_: Exception) {
                      null
                  } finally {
                      runCatching { retriever.release() }
                      runCatching { descriptor?.close() }
                      runCatching { smbSource?.close() }
                  }
              }
          }

          /** Random-access SMB bridge with small read-ahead for MP4 metadata parsing. */
          private class DurationSmbMediaDataSource(private val entry: XEntry) : MediaDataSource() {
              private var file: SmbRandomAccessFile? = null
              private val blocks = object : LinkedHashMap<Long, ByteArray>(MAX_CACHED_BLOCKS, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<Long, ByteArray>?): Boolean =
                      size > MAX_CACHED_BLOCKS
              }

              @Synchronized
              override fun readAt(position: Long, buffer: ByteArray, offset: Int, size: Int): Int {
                  if (position < 0L || position >= entry.size || size <= 0) return -1
                  val wanted = minOf(size.toLong(), entry.size - position).toInt()
                  if (wanted <= 0) return -1
                  var remotePosition = position
                  var destOffset = offset
                  var remaining = wanted
                  var copied = 0
                  while (remaining > 0) {
                      val blockStart = (remotePosition / BLOCK_SIZE) * BLOCK_SIZE
                      val block = blocks[blockStart] ?: loadBlock(blockStart).also { blocks[blockStart] = it }
                      if (block.isEmpty()) break
                      val inBlock = (remotePosition - blockStart).toInt()
                      if (inBlock >= block.size) break
                      val count = minOf(remaining, block.size - inBlock)
                      block.copyInto(buffer, destOffset, inBlock, inBlock + count)
                      remotePosition += count
                      destOffset += count
                      remaining -= count
                      copied += count
                  }
                  return if (copied > 0) copied else -1
              }

              override fun getSize(): Long = entry.size

              @Synchronized
              override fun close() {
                  blocks.clear()
                  runCatching { file?.close() }
                  file = null
              }

              private fun loadBlock(blockStart: Long): ByteArray {
                  val remainingFile = entry.size - blockStart
                  if (remainingFile <= 0L) return ByteArray(0)
                  val blockLength = minOf(BLOCK_SIZE.toLong(), remainingFile).toInt()
                  val data = ByteArray(blockLength)
                  val handle = file ?: SmbRandomAccessFile.open(entry.id, Graph.smbConnections).also { file = it }
                  var filled = 0
                  while (filled < blockLength) {
                      val count = handle.read(blockStart + filled, data, filled, blockLength - filled)
                      if (count <= 0) break
                      filled += count
                  }
                  return if (filled == data.size) data else data.copyOf(filled)
              }

              private companion object {
                  const val BLOCK_SIZE = 1024 * 1024
                  const val MAX_CACHED_BLOCKS = 4
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/browser/EntryRow.kt')
          text = path.read_text()
          imports = [
              ('import androidx.compose.runtime.mutableStateOf\n', 'import androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.produceState\n'),
              ('import app.local1st.files.core.prefs.BrowserDisplaySettings\n', 'import app.local1st.files.core.prefs.BrowserDisplaySettings\nimport app.local1st.files.core.prefs.ThumbnailSize\n'),
              ('import app.local1st.files.core.thumb.VideoThumb\n', 'import app.local1st.files.core.thumb.VideoDurationResolver\nimport app.local1st.files.core.thumb.VideoThumb\n'),
              ('import java.io.File\n', 'import java.io.File\nimport java.util.Locale\n'),
          ]
          for old, new in imports:
              if old not in text:
                  raise SystemExit(f'import marker not found: {old!r}')
              text = text.replace(old, new, 1)

          header_old = '''    val isVideo = FileTypes.categoryOf(entry.name, entry.mime) == FileCategory.VIDEO
              var loaded by remember(entry.id, entry.mtime, entry.size) { mutableStateOf(false) }
              val width = display.thumbnailSize.widthDp.dp
              val height = display.thumbnailSize.heightDp.dp
              val playBadge = if (display.thumbnailSize.widthDp >= 80) 20.dp else 16.dp
              val playIcon = if (display.thumbnailSize.widthDp >= 80) 15.dp else 12.dp
          '''
          header_new = '''    val isVideo = FileTypes.categoryOf(entry.name, entry.mime) == FileCategory.VIDEO
              var loaded by remember(entry.id, entry.mtime, entry.size) { mutableStateOf(false) }
              val showDuration = isVideo && (
                  display.thumbnailSize == ThumbnailSize.LARGE ||
                      display.thumbnailSize == ThumbnailSize.EXTRA_LARGE
                  )
              val durationMs by produceState<Long?>(
                  initialValue = null,
                  entry.id,
                  entry.mtime,
                  entry.size,
                  showDuration,
                  loaded,
              ) {
                  value = if (showDuration && loaded) VideoDurationResolver.durationMs(entry) else null
              }
              val width = display.thumbnailSize.widthDp.dp
              val height = display.thumbnailSize.heightDp.dp
              val playBadge = if (display.thumbnailSize.widthDp >= 80) 20.dp else 16.dp
              val playIcon = if (display.thumbnailSize.widthDp >= 80) 15.dp else 12.dp
          '''
          if header_old not in text:
              raise SystemExit('EntryThumbnail header not found')
          text = text.replace(header_old, header_new, 1)

          start = text.index('private fun EntryThumbnail(')
          end = text.index('\n@Composable\nprivate fun entryDetails', start)
          segment = text[start:end]
          insert_at = segment.rfind('\n    }\n}')
          if insert_at < 0:
              raise SystemExit('EntryThumbnail tail not found')
          overlay = '''
              if (showDuration && loaded) {
                  durationMs?.let { duration ->
                      Text(
                          text = formatVideoDuration(duration),
                          style = MaterialTheme.typography.labelSmall,
                          fontWeight = FontWeight.SemiBold,
                          color = Color.White,
                          modifier = Modifier
                              .align(Alignment.BottomEnd)
                              .padding(4.dp)
                              .background(Color.Black.copy(alpha = 0.72f), RoundedCornerShape(4.dp))
                              .padding(horizontal = 4.dp, vertical = 1.dp),
                      )
                  }
              }
          '''
          segment = segment[:insert_at] + overlay + segment[insert_at:]
          text = text[:start] + segment + text[end:]

          details = '\n@Composable\nprivate fun entryDetails'
          helper = '''
          private fun formatVideoDuration(durationMs: Long): String {
              val totalSeconds = (durationMs / 1000L).coerceAtLeast(0L)
              val hours = totalSeconds / 3600L
              val minutes = (totalSeconds % 3600L) / 60L
              val seconds = totalSeconds % 60L
              return if (hours > 0L) {
                  String.format(Locale.US, "%d:%02d:%02d", hours, minutes, seconds)
              } else {
                  String.format(Locale.US, "%d:%02d", minutes, seconds)
              }
          }
          '''
          if details not in text:
              raise SystemExit('entryDetails marker not found')
          text = text.replace(details, helper + details, 1)
          path.write_text(text)
          PY

          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Compile and test
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Name debug APK
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          APK_NAME="XFiles-${BASE_VERSION}-b${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ github.run_number }}-signed-debug
          path: ${{ steps.apk_name.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated duration overlay
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/app/local1st/files/ui/browser/EntryRow.kt \
            app/src/main/java/app/local1st/files/core/thumb/VideoDurationResolver.kt
          git commit -m "Show video duration on large thumbnails"
          git push
