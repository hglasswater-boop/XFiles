name: Apply compact player layout

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply compact player patch
        run: python scripts/compact_player_controls_patch.py

      - name: Restore normal workflow and remove helpers
        run: |
          git checkout origin/main -- .github/workflows/personal-fork-ci.yml
          rm -f .github/workflows/compact-player-controls-once.yml
          rm -f scripts/compact_player_controls_patch.py
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compile and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Commit verified compact layout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Compact player controls"
          git push origin HEAD:agent/player-orientation-controls
