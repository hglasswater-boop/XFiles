name: Debug CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: debug-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore incremental Android build state
        id: incremental-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            .gradle
            app/build
            vendor/bundletool-shaded/build
          key: xfiles-incremental-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'vendor/**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-${{ github.run_id }}
          restore-keys: |
            xfiles-incremental-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'app/build.gradle.kts', 'vendor/**/build.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}-

      - name: Warm incremental debug build
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Save incremental Android build state
        uses: actions/cache/save@v5
        with:
          path: |
            .gradle
            app/build
            vendor/bundletool-shaded/build
          key: ${{ steps.incremental-restore.outputs.cache-primary-key }}

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Assemble stable-signed debug APK
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: Name debug APK
        id: apk_name
        run: |
          set -eu
          BASE_VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          APK_NAME="XFiles-${BASE_VERSION}-b${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-${{ github.run_number }}-signed-debug
          path: ${{ steps.apk_name.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish debug-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete debug-latest --cleanup-tag -y 2>/dev/null || true
          gh release create debug-latest "${{ steps.apk_name.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "XFiles ${{ steps.apk_name.outputs.version }} debug build ${{ github.run_number }}" \
            --prerelease \
            --notes "Signed debug APK built from main at $GITHUB_SHA."

      - name: Record debug run metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          BODY=$(cat <<EOF
          <!-- xfiles-debug-run -->
          DEBUG_CI_RUN_ID=${{ github.run_id }}
          DEBUG_CI_RUN_NUMBER=${{ github.run_number }}
          DEBUG_APK=${{ steps.apk_name.outputs.name }}
          COMMIT=$GITHUB_SHA
          EOF
          )
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="$BODY"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -PbuildNumber=${{ github.run_number }}
