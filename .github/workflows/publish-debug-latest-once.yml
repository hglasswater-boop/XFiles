name: Publish rolling debug once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-debug-latest-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require stable signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xfiles-personal.jks"

      - name: Build signed debug APKs
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/xfiles-personal.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleMobileDebug :app:assembleTvDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name APKs
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          MOBILE_NAME="XFiles-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          TV_NAME="XFiles-TV-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$MOBILE_NAME"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "$TV_NAME"
          echo "mobile_name=$MOBILE_NAME" >> "$GITHUB_OUTPUT"
          echo "tv_name=$TV_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XFiles-rolling-debug
          path: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Drop previous rolling debug
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          CODE=$(curl -sS -o "$RUNNER_TEMP/debug-latest.json" -w '%{http_code}' \
            -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${REPO}/releases/tags/debug-latest")
          if [ "$CODE" = "200" ]; then
            ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' \
              "$RUNNER_TEMP/debug-latest.json")
            if [ -n "$ID" ]; then
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
                "https://api.github.com/repos/${REPO}/releases/${ID}"
            fi
          fi
          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
            -o /dev/null -w '' \
            "https://api.github.com/repos/${REPO}/git/refs/tags/debug-latest" || true

      - name: Publish rolling debug
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: debug-latest
          target_commitish: ${{ github.sha }}
          name: XFiles debug build ${{ steps.build_number.outputs.value }}
          prerelease: true
          body: Signed mobile and Google TV debug APKs with the 10-second tap-seek chrome suppression fix.
          files: |
            ${{ steps.apk.outputs.mobile_name }}
            ${{ steps.apk.outputs.tv_name }}

      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-debug-latest-once.yml
          git commit -m 'Remove rolling debug publish helper'
          git push origin HEAD:main
