name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-github-hosted
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD'; exit 1; }

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed mobile + TV APKs and mobile AAB
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/release.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleMobileRelease :app:assembleTvRelease :app:bundleMobileRelease -PbuildNumber=${{ steps.build_number.outputs.value }} --no-daemon

      - name: Upload mobile AAB as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XFiles-${{ steps.build_number.outputs.value }}-play-bundle
          path: app/build/outputs/bundle/mobileRelease/app-mobile-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Decide release (stable vs rolling prerelease)
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          BUILD=${{ steps.build_number.outputs.value }}
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "tag=nightly"                                       >> "$GITHUB_OUTPUT"
            echo "name=XFiles ${VERSION} nightly (build ${BUILD})"  >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                   >> "$GITHUB_OUTPUT"
            echo "apk=XFiles-nightly.apk"                            >> "$GITHUB_OUTPUT"
            echo "tv_apk=XFiles-TV-nightly.apk"                      >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}"                                   >> "$GITHUB_OUTPUT"
            echo "name=XFiles ${VERSION}"                            >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                  >> "$GITHUB_OUTPUT"
            echo "apk=XFiles-${VERSION}.apk"                         >> "$GITHUB_OUTPUT"
            echo "tv_apk=XFiles-TV-${VERSION}.apk"                   >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$SINCE" ]; then RANGE="$SINCE..HEAD"; else RANGE=HEAD; fi
          LOG=$(git log --no-merges --reverse --pretty='format:- %s' "$RANGE" \
            | grep -v '^- Bump version to ' || true)
          {
            echo 'notes<<RELEASE_NOTES'
            if [ -n "$SINCE" ]; then
              echo "### Changes since ${SINCE}"
            else
              echo "### Changes"
            fi
            echo
            if [ -n "$LOG" ]; then
              echo "$LOG"
            else
              echo "- Rebuild only, no source changes."
            fi
            if [ -n "$SINCE" ]; then
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/${SINCE}...${{ github.sha }})"
            fi
            echo RELEASE_NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/mobile/release/app-mobile-release.apk "${{ steps.decide.outputs.apk }}"
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "${{ steps.decide.outputs.tv_apk }}"

      - name: Drop previous nightly
        if: steps.decide.outputs.prerelease == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          CODE=$(curl -sS -o "$RUNNER_TEMP/nightly.json" -w '%{http_code}' \
            -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${REPO}/releases/tags/nightly")
          if [ "$CODE" = "200" ]; then
            ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' \
              "$RUNNER_TEMP/nightly.json")
            if [ -n "$ID" ]; then
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
                "https://api.github.com/repos/${REPO}/releases/${ID}"
            fi
          fi
          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
            -o /dev/null -w '' \
            "https://api.github.com/repos/${REPO}/git/refs/tags/nightly" || true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.decide.outputs.name }}
          prerelease: ${{ steps.decide.outputs.prerelease }}
          body: |
            **Dual-pane file manager with SMB/NAS, Root & Shizuku. No ads or telemetry.**

            XFiles ${{ steps.decide.outputs.version }} · build ${{ steps.decide.outputs.build }} (${{ github.sha }}).
            The standard mobile edition keeps touch UI behavior; the separate XFiles TV edition adds Google TV launcher and remote-focus behavior. Chromecast playback is available in both editions.

            ${{ steps.decide.outputs.notes }}
          files: |
            ${{ steps.decide.outputs.apk }}
            ${{ steps.decide.outputs.tv_apk }}
