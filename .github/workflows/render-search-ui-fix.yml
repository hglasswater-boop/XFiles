name: Render Search UI Fix

on:
  push:
    branches: [agent/search-ui-fix]
    paths: [__search_ui_trigger__]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Publish run marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-search-ui-render -->
          RUN_ID=${{ github.run_id }}
          STATUS=rendering"

      - uses: actions/checkout@v5
        with:
          ref: agent/search-ui-fix

      - name: Render patched PaneView
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/app/local1st/files/ui/browser/PaneView.kt')
          text = path.read_text()

          def one(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          def last(old, new, label):
              global text
              pos = text.rfind(old)
              if pos < 0:
                  raise SystemExit(f'{label}: no match')
              text = text[:pos] + new + text[pos + len(old):]

          def block(lines):
              return '\n'.join(lines)

          one(
              'import androidx.compose.material3.Text\n',
              'import androidx.compose.material3.Text\nimport androidx.compose.material3.TriStateCheckbox\n',
              'TriStateCheckbox import',
          )
          one(
              'import androidx.compose.ui.res.stringResource\n',
              'import androidx.compose.ui.res.stringResource\nimport androidx.compose.ui.state.ToggleableState\n',
              'ToggleableState import',
          )

          anchor = block([
              '    val searchParents = if (showingSearchResults) {',
              '        searchResults.associate { it.entry.id to it.parentId }',
              '    } else {',
              '        emptyMap()',
              '    }',
          ])
          selection_state = block([
              anchor,
              '    val searchSelectionTargetMap = if (',
              '        showingSearchResults && searchPhase == PaneSearchPhase.DONE',
              '    ) {',
              '        searchSelectionTargets(searchResults.map { it.entry })',
              '    } else {',
              '        emptyMap()',
              '    }',
              '    val allSearchTargets = searchSelectionTargetMap.values.flatten().distinctBy { it.id }',
              '    val selectedSearchTargetCount = allSearchTargets.count { it.id in state.selection }',
              '    val searchSelectAllState = when {',
              '        allSearchTargets.isEmpty() || selectedSearchTargetCount == 0 -> ToggleableState.Off',
              '        selectedSearchTargetCount == allSearchTargets.size -> ToggleableState.On',
              '        else -> ToggleableState.Indeterminate',
              '    }',
              '',
              '    fun setSearchTargetsSelected(targets: List<XEntry>, selected: Boolean) {',
              '        val selectedIds = state.selection',
              '        targets.forEach { target ->',
              '            if ((target.id in selectedIds) != selected) controller.toggleSelect(target)',
              '        }',
              '    }',
          ])
          one(anchor, selection_state, 'search selection state')

          header_line = '            val headerHeight = if (searchActive) SearchHeaderHeight else CrumbBarHeight\n'
          one(
              header_line,
              header_line + '            val listTopInset = statusPad + 8.dp + headerHeight\n',
              'list top inset',
          )

          old_top = 'top = statusPad + 8.dp + headerHeight,'
          if text.count(old_top) != 3:
              raise SystemExit(f'top inset: expected 3 matches, found {text.count(old_top)}')
          text = text.replace(old_top, 'top = listTopInset,')

          old_lazy = block([
              '                    LazyColumn(',
              '                        state = listState,',
              '                        contentPadding = PaddingValues(',
              '                            top = listTopInset,',
              '                            bottom = contentPadding.calculateBottomPadding(),',
              '                        ),',
              '                        modifier = Modifier.fillMaxSize(),',
              '                    ) {',
          ])
          new_lazy = block([
              '                    LazyColumn(',
              '                        state = listState,',
              '                        contentPadding = PaddingValues(',
              '                            top = if (searchActive) 0.dp else listTopInset,',
              '                            bottom = contentPadding.calculateBottomPadding(),',
              '                        ),',
              '                        modifier = Modifier',
              '                            .fillMaxSize()',
              '                            .then(',
              '                                if (searchActive) Modifier.padding(top = listTopInset)',
              '                                else Modifier,',
              '                            ),',
              '                    ) {',
          ])
          one(old_lazy, new_lazy, 'LazyColumn search viewport')

          old_row = block([
              '                            val addSmbServer = node.entry.id == SmbTreeFileSystem.ADD_SERVER_ID',
              '                            Column {',
              '                                EntryRow(',
              '                                    node = node,',
              '                                    selected = node.entry.id in state.selection,',
          ])
          new_row = block([
              '                            val addSmbServer = node.entry.id == SmbTreeFileSystem.ADD_SERVER_ID',
              '                            val searchSelectionTargetsForRow = if (showingSearchResults) {',
              '                                searchSelectionTargetMap[node.entry.id].orEmpty()',
              '                            } else {',
              '                                emptyList()',
              '                            }',
              '                            val searchRowSelected = showingSearchResults &&',
              '                                searchSelectionTargetsForRow.isNotEmpty() &&',
              '                                searchSelectionTargetsForRow.all { it.id in state.selection }',
              '                            Column {',
              '                                EntryRow(',
              '                                    node = node,',
              '                                    selected = if (showingSearchResults) {',
              '                                        searchRowSelected',
              '                                    } else {',
              '                                        node.entry.id in state.selection',
              '                                    },',
          ])
          one(old_row, new_row, 'search row selection')

          old_toggle = block([
              '                                    onToggleSelect = {',
              '                                        onActivate()',
              '                                        controller.toggleSelect(node.entry)',
              '                                    },',
          ])
          new_toggle = block([
              '                                    onToggleSelect = {',
              '                                        onActivate()',
              '                                        if (showingSearchResults && searchSelectionTargetsForRow.isNotEmpty()) {',
              '                                            setSearchTargetsSelected(',
              '                                                searchSelectionTargetsForRow,',
              '                                                !searchRowSelected,',
              '                                            )',
              '                                        } else {',
              '                                            controller.toggleSelect(node.entry)',
              '                                        }',
              '                                    },',
          ])
          one(old_toggle, new_toggle, 'row toggle selection')

          old_header_call = block([
              '            if (searchActive) {',
              '                PaneSearchHeader(',
              '                    query = searchQuery,',
              '                    phase = searchPhase,',
              '                    onQueryChange = ::updateSearchQuery,',
              '                    onClose = onSearchClose,',
              '                )',
          ])
          new_header_call = block([
              '            if (searchActive) {',
              '                PaneSearchHeader(',
              '                    query = searchQuery,',
              '                    phase = searchPhase,',
              '                    selectAllState = searchSelectAllState.takeIf { allSearchTargets.isNotEmpty() },',
              '                    onSelectAll = {',
              '                        onActivate()',
              '                        setSearchTargetsSelected(',
              '                            allSearchTargets,',
              '                            searchSelectAllState != ToggleableState.On,',
              '                        )',
              '                    },',
              '                    onQueryChange = ::updateSearchQuery,',
              '                    onClose = onSearchClose,',
              '                )',
          ])
          last(old_header_call, new_header_call, 'search header select all')

          old_signature = block([
              'private fun BoxScope.PaneSearchHeader(',
              '    query: String,',
              '    phase: PaneSearchPhase,',
              '    onQueryChange: (String) -> Unit,',
              '    onClose: () -> Unit,',
              ') {',
          ])
          new_signature = block([
              'private fun BoxScope.PaneSearchHeader(',
              '    query: String,',
              '    phase: PaneSearchPhase,',
              '    selectAllState: ToggleableState? = null,',
              '    onSelectAll: () -> Unit = {},',
              '    onQueryChange: (String) -> Unit,',
              '    onClose: () -> Unit,',
              ') {',
          ])
          one(old_signature, new_signature, 'search header signature')

          loading = block([
              '                if (phase == PaneSearchPhase.SEARCHING && query.trim().length >= SEARCH_MIN_QUERY_LENGTH) {',
              '                    LoadingIndicator(Modifier.size(20.dp))',
              '                }',
          ])
          checkbox = block([
              loading,
              '                if (selectAllState != null) {',
              '                    TriStateCheckbox(state = selectAllState, onClick = onSelectAll)',
              '                }',
          ])
          one(loading, checkbox, 'search header checkbox')

          helper_anchor = 'private fun searchEntryWasRemoved(entryId: String, removedIds: Set<String>): Boolean {'
          helper = block([
              'internal fun searchSelectionTargets(entries: List<XEntry>): Map<String, List<XEntry>> {',
              '    if (entries.isEmpty()) return emptyMap()',
              '    val unique = LinkedHashMap<String, XEntry>()',
              '    entries.forEach { unique[it.id] = it }',
              '    val matchedIds = unique.keys',
              '    val matchedAncestors = HashSet<String>()',
              '    unique.values.forEach { entry ->',
              '        var current = XId.parent(entry.id)',
              '        while (current != null) {',
              '            if (current in matchedIds) matchedAncestors += current',
              '            current = XId.parent(current)',
              '        }',
              '    }',
              '    val targets = LinkedHashMap<String, MutableList<XEntry>>()',
              '    unique.values.filterNot { it.id in matchedAncestors }.forEach { terminal ->',
              '        var current: String? = terminal.id',
              '        while (current != null) {',
              '            if (current in matchedIds) targets.getOrPut(current) { mutableListOf() }.add(terminal)',
              '            current = XId.parent(current)',
              '        }',
              '    }',
              '    return unique.keys.associateWith { targets[it].orEmpty() }',
              '}',
              '',
              helper_anchor,
          ])
          one(helper_anchor, helper, 'search selection helper')

          path.write_text(text)
          PY

      - name: Upload patched PaneView
        uses: actions/upload-artifact@v4
        with:
          name: patched-pane-view
          path: app/src/main/java/app/local1st/files/ui/browser/PaneView.kt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish ready marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/27/comments" \
            -f body="<!-- xfiles-search-ui-render -->
          RUN_ID=${{ github.run_id }}
          STATUS=ready"
