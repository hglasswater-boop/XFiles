name: TV focus entry and rail patch

on:
  push:
    branches:
      - fix/tv-focus-entry-and-rail

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-focus-entry-and-rail
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-tv-focus-entry-and-rail.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/tv/java/app/local1st/files/ui/browser/PaneView.kt app/src/tv/java/app/local1st/files/ui/main/EditionSideActionMenu.kt
          git commit -m "Fix TV startup and rail focus transitions"
          git push origin HEAD:fix/tv-focus-entry-and-rail
