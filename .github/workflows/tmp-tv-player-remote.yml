name: TV player remote patch

on:
  push:
    branches:
      - feat/tv-player-remote-controls
    paths:
      - .github/workflows/tmp-tv-player-remote.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tv-player-remote-controls
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-tv-player-remote.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/local1st/files/ui/viewer/VideoPlayer.kt app/src/tv/java/app/local1st/files/ui/viewer/MediaViewer.kt
          git commit -m "Polish Google TV player remote controls"
          git push origin HEAD:feat/tv-player-remote-controls
