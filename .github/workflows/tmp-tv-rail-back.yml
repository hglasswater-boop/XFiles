name: TV rail Back patch

on:
  push:
    branches:
      - fix/tv-pane-global-dpad-and-rail-exit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-pane-global-dpad-and-rail-exit
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-tv-rail-back.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/tv/java/app/local1st/files/ui/main/EditionSideActionMenu.kt app/src/main/java/app/local1st/files/ui/main/MainScreen.kt
          git commit -m "Close TV side rail with Back before app exit"
          git push origin HEAD:fix/tv-pane-global-dpad-and-rail-exit
