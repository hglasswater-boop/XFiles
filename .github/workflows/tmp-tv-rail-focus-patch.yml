name: Temporary TV rail focus patch

on:
  push:
    branches:
      - fix/tv-rail-focus

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/tv-rail-focus
      - name: Apply focus patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/app/local1st/files/ui/main/MainScreen.kt')
          text = main.read_text()
          import_anchor = 'import androidx.compose.ui.graphics.Color\n'
          key_imports = '''import androidx.compose.ui.input.key.Key\nimport androidx.compose.ui.input.key.KeyEventType\nimport androidx.compose.ui.input.key.key\nimport androidx.compose.ui.input.key.onPreviewKeyEvent\nimport androidx.compose.ui.input.key.type\n'''
          if key_imports not in text:
              if import_anchor not in text:
                  raise SystemExit('MainScreen import anchor not found')
              text = text.replace(import_anchor, import_anchor + key_imports, 1)

          old_modifier = '''                        modifier = Modifier.padding(horizontal = 4.dp),\n'''
          new_modifier = '''                        modifier = Modifier\n                            .padding(horizontal = 4.dp)\n                            .then(\n                                if (isTvEdition && searchPane != page) {\n                                    Modifier.onPreviewKeyEvent { event ->\n                                        if (event.type != KeyEventType.KeyDown) {\n                                            false\n                                        } else {\n                                            when (event.key) {\n                                                Key.DirectionLeft -> {\n                                                    requestEditionSideRail(left = true)\n                                                    true\n                                                }\n                                                Key.DirectionRight -> {\n                                                    requestEditionSideRail(left = false)\n                                                    true\n                                                }\n                                                else -> false\n                                            }\n                                        }\n                                    }\n                                } else {\n                                    Modifier\n                                },\n                            ),\n'''
          if new_modifier not in text:
              if text.count(old_modifier) != 1:
                  raise SystemExit(f'Expected one pager PaneView modifier, found {text.count(old_modifier)}')
              text = text.replace(old_modifier, new_modifier, 1)
          main.write_text(text)

          tv = Path('app/src/tv/java/app/local1st/files/ui/main/EditionSideActionMenu.kt')
          text = tv.read_text()
          text = text.replace('import androidx.compose.foundation.focusable\n', '', 1)

          action_anchor = '''private data class TvRailAction(\n    val label: String,\n    val icon: ImageVector,\n    val enabled: Boolean = true,\n    val onClick: () -> Unit,\n)\n'''
          request_support = '''\nprivate data class TvRailOpenRequest(\n    val left: Int = 0,\n    val right: Int = 0,\n)\n\nprivate val tvRailOpenRequest = mutableStateOf(TvRailOpenRequest())\n\ninternal fun requestEditionSideRail(left: Boolean) {\n    val current = tvRailOpenRequest.value\n    tvRailOpenRequest.value = if (left) {\n        current.copy(left = current.left + 1)\n    } else {\n        current.copy(right = current.right + 1)\n    }\n}\n'''
          if request_support.strip() not in text:
              if action_anchor not in text:
                  raise SystemExit('TV action anchor not found')
              text = text.replace(action_anchor, action_anchor + request_support, 1)

          box_anchor = '''    Box(Modifier.fillMaxSize()) {\n        FocusRevealRail(\n            alignment = Alignment.CenterStart,\n            status = leftStatus,\n            actions = leftActions,\n        )\n        FocusRevealRail(\n            alignment = Alignment.CenterEnd,\n            actions = rightActions,\n        )\n    }\n'''
          box_replacement = '''    val railOpenRequest = tvRailOpenRequest.value\n    Box(Modifier.fillMaxSize()) {\n        FocusRevealRail(\n            alignment = Alignment.CenterStart,\n            status = leftStatus,\n            actions = leftActions,\n            openRequest = railOpenRequest.left,\n        )\n        FocusRevealRail(\n            alignment = Alignment.CenterEnd,\n            actions = rightActions,\n            openRequest = railOpenRequest.right,\n        )\n    }\n'''
          if box_replacement not in text:
              if box_anchor not in text:
                  raise SystemExit('TV rail Box anchor not found')
              text = text.replace(box_anchor, box_replacement, 1)

          sig_anchor = '''private fun BoxScope.FocusRevealRail(\n    alignment: Alignment,\n    status: String? = null,\n    actions: List<TvRailAction>,\n) {\n    var visible by remember { mutableStateOf(false) }\n    val firstEnabledIndex = actions.indexOfFirst { it.enabled }\n    val firstActionRequester = remember(actions.size, firstEnabledIndex) { FocusRequester() }\n'''
          sig_replacement = '''private fun BoxScope.FocusRevealRail(\n    alignment: Alignment,\n    status: String? = null,\n    actions: List<TvRailAction>,\n    openRequest: Int,\n) {\n    var visible by remember { mutableStateOf(false) }\n    var railHadFocus by remember { mutableStateOf(false) }\n    val firstEnabledIndex = actions.indexOfFirst { it.enabled }\n    val firstActionRequester = remember(actions.size, firstEnabledIndex) { FocusRequester() }\n\n    LaunchedEffect(openRequest, firstEnabledIndex) {\n        if (openRequest > 0 && firstEnabledIndex >= 0) {\n            visible = true\n        }\n    }\n'''
          if sig_replacement not in text:
              if sig_anchor not in text:
                  raise SystemExit('TV rail signature anchor not found')
              text = text.replace(sig_anchor, sig_replacement, 1)

          old_focus_box = '''    Box(\n        modifier = Modifier\n            .align(alignment)\n            .fillMaxHeight()\n            .width(if (visible) 104.dp else 12.dp)\n            .focusGroup()\n            .onFocusChanged { state -> visible = state.hasFocus },\n    ) {\n        Box(\n            Modifier\n                .align(\n                    if (alignment == Alignment.CenterStart) {\n                        Alignment.CenterStart\n                    } else {\n                        Alignment.CenterEnd\n                    },\n                )\n                .fillMaxHeight()\n                .width(12.dp)\n                .onFocusChanged { state ->\n                    if (state.isFocused) visible = true\n                }\n                .focusable(),\n        )\n\n'''
          new_focus_box = '''    Box(\n        modifier = Modifier\n            .align(alignment)\n            .fillMaxHeight()\n            .width(if (visible) 104.dp else 0.dp)\n            .focusGroup()\n            .onFocusChanged { state ->\n                if (state.hasFocus) {\n                    railHadFocus = true\n                } else if (railHadFocus) {\n                    railHadFocus = false\n                    visible = false\n                }\n            },\n    ) {\n'''
          if new_focus_box not in text:
              if old_focus_box not in text:
                  raise SystemExit('TV hidden focus edge block not found')
              text = text.replace(old_focus_box, new_focus_box, 1)
          tv.write_text(text)

          mobile = Path('app/src/mobile/java/app/local1st/files/ui/main/EditionSideActionMenu.kt')
          text = mobile.read_text()
          helper = '''internal fun requestEditionSideRail(left: Boolean) = Unit\n\n'''
          composable_anchor = '@Suppress("UNUSED_PARAMETER")\n@Composable\n'
          if helper not in text:
              if composable_anchor not in text:
                  raise SystemExit('Mobile stub anchor not found')
              text = text.replace(composable_anchor, helper + composable_anchor, 1)
          mobile.write_text(text)
          PY

          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/app/local1st/files/ui/main/MainScreen.kt \
                  app/src/tv/java/app/local1st/files/ui/main/EditionSideActionMenu.kt \
                  app/src/mobile/java/app/local1st/files/ui/main/EditionSideActionMenu.kt
          git commit -m "Fix TV rail focus stealing browser navigation"
          git push origin HEAD:fix/tv-rail-focus
