name: TV row key handler patch

on:
  push:
    branches:
      - fix/tv-pane-dpad-always-on

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-pane-dpad-always-on
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-tv-row-key-handler.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/tv/java/app/local1st/files/ui/browser/PaneView.kt
          git commit -m "Handle TV vertical D-pad keys on focused rows"
          git push origin HEAD:fix/tv-pane-dpad-always-on
