name: TV single-pane patch

on:
  push:
    branches:
      - perf/tv-true-single-pane
    paths:
      - .github/workflows/tmp-tv-single-pane.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/tv-true-single-pane
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply-tv-single-pane.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/app/local1st/files/ui/main/MainViewModel.kt app/src/main/java/app/local1st/files/ui/main/MainScreen.kt
          git commit -m "Make Google TV browser truly single-pane"
          git push origin HEAD:perf/tv-true-single-pane
