name: Verify SMB fix

on:
  push:
    branches:
      - fix/smb-share-open-with

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Report pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: cdb43547f06baeb73ad635fc40b682ee25789711
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$TARGET_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"manual-build/smb-share-open-with\",\"description\":\"assembleDebug + testDebugUnitTest\",\"target_url\":\"$RUN_URL\"}"
      - uses: actions/checkout@v5
        with:
          ref: cdb43547f06baeb73ad635fc40b682ee25789711
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PbuildNumber=1
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest -PbuildNumber=1
      - name: Report result on target commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: cdb43547f06baeb73ad635fc40b682ee25789711
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          case "$JOB_STATUS" in
            success) STATE=success ;;
            cancelled) STATE=error ;;
            *) STATE=failure ;;
          esac
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$TARGET_SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"manual-build/smb-share-open-with\",\"description\":\"assembleDebug + testDebugUnitTest\",\"target_url\":\"$RUN_URL\"}"
